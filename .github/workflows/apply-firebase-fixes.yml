name: Apply Firebase Config Hardening

on:
  workflow_dispatch:
    inputs:
      pr_title:
        description: 'Pull Request Title'
        required: false
        default: 'Fix: Harden Firebase initialization and add safe helpers'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create feature branch
        id: branch
        run: |
          BRANCH="fix/firebase-hardening-$(date +%s)"
          echo "branch_name=$BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$BRANCH"

      - name: Create firebaseHelpers.js
        run: |
          mkdir -p public
          cat > public/firebaseHelpers.js << 'EOF'
// Safe Firestore helpers for the frontend
// Provides defensive wrappers around Firebase operations
import { db } from './firebase.js';
import { setDoc, getDoc } from 'firebase/firestore';

/**
 * Check if Firestore database instance is available
 * @returns {boolean} true if db is initialized
 */
export function getDbAvailable() {
  return db !== null && db !== undefined;
}

/**
 * Safely set a document with error handling
 * @param {DocumentReference} ref - Document reference
 * @param {Object} data - Document data
 * @param {Object} options - SetOptions
 * @returns {Promise<boolean>} Success status
 */
export async function safeSetDoc(ref, data, options = {}) {
  if (!getDbAvailable()) {
    console.error('[ConvoQuest] safeSetDoc: Firestore not initialized. Aborting setDoc.');
    return false;
  }
  
  try {
    await setDoc(ref, data, options);
    return true;
  } catch (err) {
    console.error('[ConvoQuest] safeSetDoc error:', err);
    return false;
  }
}

/**
 * Safely get a document with error handling
 * @param {DocumentReference} ref - Document reference
 * @returns {Promise<DocumentSnapshot|null>} Document snapshot or null
 */
export async function safeGetDoc(ref) {
  if (!getDbAvailable()) {
    console.error('[ConvoQuest] safeGetDoc: Firestore not initialized. Aborting getDoc.');
    return null;
  }
  
  try {
    return await getDoc(ref);
  } catch (err) {
    console.error('[ConvoQuest] safeGetDoc error:', err);
    return null;
  }
}
EOF

      - name: Add defensive checks to app.js
        run: |
          # Create backup
          cp public/app.js public/app.js.backup
          
          # Add import for safe helpers at the top
          sed -i '1i import { safeSetDoc, safeGetDoc, getDbAvailable } from '"'"'./firebaseHelpers.js'"'"';\n' public/app.js
          
          # Add configuration banner creation function
          cat >> public/app.js << 'EOF'

// Firebase Configuration Banner Functions
function createConfigBanner() {
  const banner = document.createElement('div');
  banner.id = 'firebase-config-banner';
  banner.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #fef3c7;
    color: #92400e;
    padding: 12px 20px;
    border-bottom: 2px solid #f59e0b;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    z-index: 10000;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  `;
  
  banner.innerHTML = `
    <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <strong>⚠️ Firebase Configuration Missing</strong>
        <span id="config-banner-details" style="margin-left: 12px; opacity: 0.8;"></span>
      </div>
      <button id="config-details-btn" style="
        background: #f59e0b;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      ">Show Details</button>
    </div>
  `;
  
  // Add click handler for details button
  banner.querySelector('#config-details-btn').addEventListener('click', () => {
    if (window.showFirebaseConfigurationError) {
      window.showFirebaseConfigurationError();
    } else {
      alert('Firebase configuration is incomplete. Please copy .env.example to .env and fill in your Firebase project details.');
    }
  });
  
  return banner;
}

function updateConfigBanner(configStatus, bannerEl) {
  if (!bannerEl) return;
  
  bannerEl.style.display = 'block';
  const details = bannerEl.querySelector('#config-banner-details');
  
  if (configStatus?.error?.type === 'missing_variables') {
    const missing = configStatus.error.missingEnvVars?.join(', ') || 'environment variables';
    details.textContent = `Missing: ${missing}`;
  } else if (configStatus?.error?.type === 'initialization_failed') {
    details.textContent = `Initialization failed: ${configStatus.error.error}`;
  } else {
    details.textContent = 'Authentication and database features disabled.';
  }
  
  // Disable auth UI
  disableAuthInterface();
}

function hideConfigBanner(bannerEl) {
  if (bannerEl) {
    bannerEl.style.display = 'none';
  }
}

function disableAuthInterface() {
  const authButtons = ['login-btn', 'signup-btn', 'logout-btn'];
  authButtons.forEach(id => {
    const btn = document.getElementById(id);
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '0.5';
      btn.title = 'Disabled: Firebase not configured';
    }
  });
  
  // Also disable auth forms
  const authForms = document.querySelectorAll('form[id*="auth"], form[id*="login"], form[id*="signup"]');
  authForms.forEach(form => {
    const inputs = form.querySelectorAll('input, button');
    inputs.forEach(input => {
      input.disabled = true;
      if (input.tagName === 'INPUT') {
        input.placeholder = 'Firebase configuration required';
      }
    });
  });
}

// Modify the existing initializeApp function to include defensive checks
const originalInitializeApp = window.initializeApp;
window.initializeApp = function() {
  console.log('[ConvoQuest] Starting enhanced Firebase initialization...');
  
  // Create and inject configuration banner
  const configBanner = createConfigBanner();
  document.body.insertBefore(configBanner, document.body.firstChild);
  
  // Check Firebase configuration status
  const configStatus = window.getFirebaseConfigStatus ? window.getFirebaseConfigStatus() : { configured: false };
  
  if (!configStatus.configured) {
    console.error('[ConvoQuest] Firebase configuration incomplete - running in safe mode');
    updateConfigBanner(configStatus, configBanner);
    
    // Still initialize the rest of the app, but with disabled auth
    if (originalInitializeApp) {
      try {
        originalInitializeApp();
      } catch (err) {
        console.error('[ConvoQuest] Error in original initialization:', err);
      }
    }
    return;
  }
  
  // Configuration is valid - hide banner and proceed normally
  hideConfigBanner(configBanner);
  
  if (originalInitializeApp) {
    originalInitializeApp();
  }
};
EOF

      - name: Commit changes
        run: |
          git add public/firebaseHelpers.js public/app.js
          git commit -m "Add Firebase config hardening and safe Firestore helpers

          - Created firebaseHelpers.js with safe wrapper functions
          - Added defensive initialization checks to app.js  
          - Added configuration banner for missing Firebase variables
          - Disabled auth UI when Firebase is not properly configured
          - Enhanced error handling and user feedback"

      - name: Push feature branch
        run: |
          git push -u origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch.outputs.branch_name }}
          title: ${{ github.event.inputs.pr_title }}
          body: |
            ## 🔧 Firebase Configuration Hardening

            This PR implements defensive programming practices for Firebase initialization to prevent crashes when environment variables are missing or invalid.

            ### ✅ Changes Made

            **New File: `public/firebaseHelpers.js`**
            - ✨ Safe wrapper functions for Firestore operations (`safeSetDoc`, `safeGetDoc`)
            - 🛡️ Automatic availability checks before database operations
            - 📝 Comprehensive error logging with ConvoQuest prefix
            - 🔄 Graceful fallbacks when Firebase is unavailable

            **Enhanced: `public/app.js`** 
            - 🚨 Firebase configuration status checking on app startup
            - 🎯 In-app configuration banner for missing variables  
            - 🔒 Automatic auth interface disabling when Firebase unavailable
            - 🛡️ Defensive initialization with error boundaries

            ### 🧪 Testing Instructions

            **Test Case 1: Missing Configuration**
            ```bash
            # Backup current config
            cp .env .env.backup
            
            # Create invalid config
            cp .env.example .env
            # Leave VITE_FIREBASE_API_KEY blank or remove it
            
            # Start development server
            npm run dev
            ```
            
            **Expected Results:**
            - ✅ App loads without crashing
            - ✅ Yellow configuration banner appears at top
            - ✅ Auth buttons are disabled and grayed out
            - ✅ "Show Details" button explains the issue
            - ✅ Console shows helpful error messages (no crashes)

            **Test Case 2: Valid Configuration**
            ```bash
            # Restore working config  
            cp .env.backup .env
            
            # Restart dev server
            npm run dev
            ```
            
            **Expected Results:**
            - ✅ Banner is hidden
            - ✅ Auth interface works normally
            - ✅ Firebase operations proceed as before

            ### 🔒 Security & Compatibility

            - **No breaking changes** - existing functionality preserved
            - **Backward compatible** - safe fallbacks for all operations  
            - **No credentials exposed** - only adds defensive checks
            - **Performance optimized** - minimal overhead for config checking

            ### 🎯 Benefits

            - 🚀 **Better UX**: Users see helpful messages instead of crashes
            - 🛡️ **Robust**: App handles missing/invalid Firebase config gracefully  
            - 🔍 **Debuggable**: Clear error messages guide developers to solutions
            - 📱 **Professional**: Clean in-app notifications instead of console errors

            ---
            
            **Ready to merge** ✨ This PR makes the app more resilient and user-friendly when Firebase configuration is incomplete.
          labels: |
            enhancement
            firebase  
            bug-fix
            defensive-programming
