<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Configuration Debug - ConvoQuest</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">🔧 Firebase Configuration Debug</h1>
                <p class="text-gray-600">This page helps you diagnose Firebase configuration issues.</p>
            </div>

            <div id="config-status" class="bg-white rounded-lg shadow-lg p-6 mb-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Loading configuration status...</h2>
            </div>

            <div class="bg-blue-50 border border-blue-200 rounded-lg p-6">
                <h2 class="text-lg font-semibold text-blue-800 mb-3">Quick Actions</h2>
                <div class="space-y-2">
                    <a href="/" class="inline-block bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors">
                        ← Back to App
                    </a>
                    <button onclick="window.location.reload()" class="inline-block bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 transition-colors ml-2">
                        🔄 Refresh Status
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getFirebaseConfigStatus } from './firebase.js';

        function displayConfigStatus() {
            const statusDiv = document.getElementById('config-status');
            const status = getFirebaseConfigStatus();

            let content = '';
            
            if (status.configured) {
                content = `
                    <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                        <h2 class="text-xl font-semibold text-green-800 mb-4">✅ Firebase Configuration: SUCCESS</h2>
                        <p class="text-green-700">All Firebase services are properly configured and initialized.</p>
                    </div>
                `;
            } else {
                content = `
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                        <h2 class="text-xl font-semibold text-red-800 mb-4">❌ Firebase Configuration: ERROR</h2>
                        <p class="text-red-700 mb-4">${status.error.message}</p>
                        
                        ${status.error.type === 'missing_variables' ? `
                            <div class="bg-yellow-50 border border-yellow-200 rounded p-3 mb-4">
                                <h3 class="font-semibold text-yellow-800 mb-2">Missing Environment Variables:</h3>
                                <ul class="list-disc list-inside text-yellow-700 space-y-1">
                                    ${status.error.missingEnvVars.map(envVar => `<li><code class="bg-yellow-100 px-2 py-1 rounded">${envVar}</code></li>`).join('')}
                                </ul>
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Configuration details table
            content += `
                <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Configuration Details</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;

            Object.entries(status.config).forEach(([key, value]) => {
                const envVar = `VITE_FIREBASE_${key.replace(/([A-Z])/g, '_$1').toUpperCase()}`;
                const isSet = value.includes('✓');
                const isPlaceholder = value.includes('⚠️');
                const isMissing = value.includes('✗');
                
                let statusClass, statusIcon, statusText;
                if (isSet) {
                    statusClass = 'text-green-600 bg-green-50 border-green-200';
                    statusIcon = '✅';
                    statusText = 'Set';
                } else if (isPlaceholder) {
                    statusClass = 'text-yellow-600 bg-yellow-50 border-yellow-200';
                    statusIcon = '⚠️';
                    statusText = 'Placeholder';
                } else {
                    statusClass = 'text-red-600 bg-red-50 border-red-200';
                    statusIcon = '❌';
                    statusText = 'Missing';
                }

                content += `
                    <div class="flex justify-between items-center p-3 rounded border ${statusClass}">
                        <span class="font-medium">${envVar}</span>
                        <span class="font-semibold">${statusIcon} ${statusText}</span>
                    </div>
                `;
            });

            content += `
                    </div>
                </div>
            `;

            // Environment info
            content += `
                <div class="mt-6 bg-gray-50 border border-gray-200 rounded-lg p-4">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Environment Information</h3>
                    <div class="space-y-2 text-sm">
                        <div><strong>Node Environment:</strong> ${import.meta.env.MODE || 'development'}</div>
                        <div><strong>Base URL:</strong> ${import.meta.env.BASE_URL || '/'}</div>
                        <div><strong>Dev Mode:</strong> ${import.meta.env.DEV ? 'Yes' : 'No'}</div>
                        <div><strong>Production Mode:</strong> ${import.meta.env.PROD ? 'Yes' : 'No'}</div>
                        <div><strong>Timestamp:</strong> ${new Date().toLocaleString()}</div>
                    </div>
                </div>
            `;

            statusDiv.innerHTML = content;
        }

        // Load status when page loads
        displayConfigStatus();

        // Auto-refresh every 30 seconds
        setInterval(displayConfigStatus, 30000);
    </script>
</body>
</html>
