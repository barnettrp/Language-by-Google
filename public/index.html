<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ConvoQuest</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ocean-teal': '#2A9D8F',
            'sandy-orange': '#F4A261',
            'sun-yellow': '#E9C46A',
            'seashell-white': '#FEFDF5',
          },
        },
      },
    };
  </script>

  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
      background: #FEFDF5;
    }
    .focus-ring:focus { outline: none; box-shadow: 0 0 0 3px rgba(42,157,143,0.35); }
    .link { color: #2A9D8F; text-decoration: underline; }
  </style>

  <!-- Boot flag so we can detect if the module didn't run -->
  <script>window.__cqBooted = false;</script>
</head>

<body class="min-h-screen">
  <!-- Status banner (auto-hides if all good) -->
  <div id="statusBanner" class="hidden px-4 py-3 text-sm bg-yellow-50 text-yellow-900 border-b border-yellow-200">
    Loading…
  </div>

  <div class="mx-auto max-w-3xl p-4">

    <!-- Login Screen -->
    <section id="loginScreen" class="bg-white rounded-2xl shadow p-6 border border-ocean-teal/10">
      <h1 class="text-2xl font-semibold text-ocean-teal mb-2">Welcome to ConvoQuest</h1>
      <p class="text-gray-600 mb-6">Log in to continue.</p>

      <form id="loginForm" class="grid gap-4">
        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Email</span>
          <input id="email" type="email" class="border rounded-lg px-3 py-2 focus-ring" placeholder="you@example.com" required />
        </label>

        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Password</span>
          <input id="password" type="password" class="border rounded-lg px-3 py-2 focus-ring" placeholder="••••••••" required />
        </label>

        <button id="loginBtn" class="bg-ocean-teal text-white rounded-xl px-4 py-2 hover:opacity-90 active:opacity-80 transition focus-ring">
          Log In
        </button>

        <p id="loginError" class="text-red-600 text-sm hidden"></p>

        <p class="text-sm text-gray-700">
          New here?
          <a id="signupLink" href="#" class="link">Create an account</a>
        </p>
      </form>

      <!-- Sign Up form (hidden by default) -->
      <form id="signupForm" class="grid gap-4 hidden mt-6">
        <h2 class="text-lg font-semibold">Create account</h2>

        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Email</span>
          <input id="signupEmail" type="email" class="border rounded-lg px-3 py-2 focus-ring" placeholder="you@example.com" />
        </label>

        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Password (min 6 chars)</span>
          <input id="signupPassword" type="password" class="border rounded-lg px-3 py-2 focus-ring" placeholder="••••••••" />
        </label>

        <div class="flex items-center gap-2">
          <button id="createAccountBtn" class="border rounded-lg px-4 py-2 hover:bg-seashell-white focus-ring">Sign Up</button>
          <a id="backToLogin" href="#" class="link">Back to Login</a>
        </div>

        <p id="signupError" class="text-red-600 text-sm hidden"></p>
      </form>
    </section>

    <!-- Main App Screen -->
    <section id="appScreen" class="hidden bg-white rounded-2xl shadow p-6 border border-ocean-teal/10 mt-6">
      <header class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-ocean-teal">ConvoQuest</h2>
        <div class="flex items-center gap-3">
          <span id="whoami" class="text-sm text-gray-600"></span>
          <button id="hintBtn" class="border rounded-lg px-3 py-1 hover:bg-seashell-white focus-ring" title="Get a hint">💡 Hint</button>
          <button id="logoutBtn" class="border rounded-lg px-3 py-1 hover:bg-seashell-white focus-ring">Log out</button>
        </div>
      </header>

      <!-- Messages -->
      <div id="messages" class="border rounded-xl p-4 h-72 overflow-y-auto bg-seashell-white/60 mb-4"></div>

      <!-- Chat input -->
      <form id="chatForm" class="flex gap-2">
        <input id="userInput" class="flex-1 border rounded-lg px-3 py-2 focus-ring" placeholder="Type a message…" autocomplete="off" />
        <button id="sendBtn" class="bg-sandy-orange text-white rounded-xl px-4 py-2 hover:opacity-90 active:opacity-80 transition focus-ring">Send</button>
      </form>

      <!-- Translate utility -->
      <div class="mt-6 grid gap-3">
        <div class="flex items-center gap-2">
          <h3 class="font-medium text-gray-800">Quick Translate</h3>
          <span class="text-xs text-gray-500">(Google Translate API)</span>
        </div>

        <div class="grid sm:grid-cols-[1fr_auto_auto] gap-2">
          <input id="translateInput" class="border rounded-lg px-3 py-2 focus-ring" placeholder="Text to translate…" />
          <select id="translateTarget" class="border rounded-lg px-3 py-2 focus-ring">
            <option value="es">Spanish (es)</option>
            <option value="en">English (en)</option>
            <option value="fr">French (fr)</option>
            <option value="de">German (de)</option>
            <option value="it">Italian (it)</option>
            <option value="pt">Portuguese (pt)</option>
          </select>
          <button id="translateBtn" class="border rounded-lg px-4 py-2 hover:bg-seashell-white focus-ring">Translate</button>
        </div>

        <div id="translateOut" class="min-h-10 border rounded-lg px-3 py-2 bg-seashell-white/60 text-gray-800"></div>
      </div>
    </section>
  </div>

  <!-- MAIN APP (module) -->
  <script type="module">
    // Mark that the module actually ran (used by the banner below)
    window.__cqBooted = true;

    // --- Firebase SDK (modular) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth, onAuthStateChanged,
      signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    // Helper DOM utils
    const $ = (id) => document.getElementById(id);
    const banner = $("statusBanner");
    function show(el, yes) { el.classList.toggle("hidden", !yes); }
    function setBusy(btn, busy) { if (!btn) return; btn.disabled = busy; btn.style.opacity = busy ? "0.6" : "1"; }
    function note(msg, color="yellow") {
      banner.textContent = msg;
      banner.className = `px-4 py-3 text-sm border-b ${color==="red" ? "bg-red-50 text-red-900 border-red-200" : "bg-yellow-50 text-yellow-900 border-yellow-200"}`;
      banner.classList.remove("hidden");
    }
    function clearNote() { banner.classList.add("hidden"); }

    // Init Firebase
    let auth;
    try {
      const fbApp = initializeApp(firebaseConfig);
      auth = getAuth(fbApp);
      clearNote(); // init OK
    } catch (e) {
      console.error(e);
      note("Firebase failed to initialize. Check firebase-config.js path and contents.", "red");
    }

    // Chat UI helpers
    const messagesState = [];
    function addMessage(text, role = "ai") {
      const box = $("messages");
      const wrap = document.createElement("div");
      wrap.className = `mb-3 ${role === "user" ? "text-right" : "text-left"}`;
      const bubble = document.createElement("div");
      bubble.className = "inline-block max-w-[80%] rounded-xl px-3 py-2 " + (role === "user" ? "bg-ocean-teal text-white" : "bg-white border");
      bubble.textContent = String(text ?? "");
      wrap.appendChild(bubble);
      box.appendChild(wrap);
      box.scrollTop = box.scrollHeight;
    }

    function flipToApp(user) {
      $("whoami").textContent = user?.email ? "Signed in as " + user.email : "";
      show($("loginScreen"), false);
      show($("appScreen"), true);
      if (!messagesState.length) addMessage("You're logged in. How can I help?", "ai");
    }
    function flipToLogin() {
      show($("appScreen"), false);
      show($("loginScreen"), true);
      $("whoami").textContent = "";
      $("messages").innerHTML = "";
      messagesState.length = 0;
    }

    // Auth state
    if (auth) {
      onAuthStateChanged(auth, (user) => {
        if (user) { clearNote(); flipToApp(user); }
        else { flipToLogin()
