            </div>
            <div id="chat-view" class="hidden flex-col h-full">

                    <button id="end-session-btn" class="bg-red-500 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-red-600 transition-colors">End Session</button>
                </header>
                <div id="chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
                <div id="translation-popover" class="hidden absolute bg-black text-white text-xs rounded py-1 px-2 z-10 shadow-lg text-center"></div>
                <footer class="p-4 border-t border-gray-200/80 flex-shrink-0">

                        <button id="mic-btn" class="text-gray-500 hover:text-blue-500 rounded-full p-3 transition-colors">
                            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4z" /><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM2 10a2 2 0 114 0v1a2 2 0 11-4 0v-1zm14-1a2 2 0 10-4 0v1a2 2 0 104 0v-1z" clip-rule="evenodd" /></svg>
                        </button>

                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>

                    </div>

            </div>
            <div id="report-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                     <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Session Report</h2><button id="close-report-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                    <div id="report-content" class="space-y-4"></div>
                    <div id="report-loading" class="hidden text-center"><p>✨ Analyzing your conversation...</p></div>
                </div>
            </div>
            <div id="settings-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                 <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Settings</h2><button id="close-settings-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                    <div class="space-y-4">
                        <div>
                            <label class="font-semibold">Dialect</label>
                            <select id="dialect-select" class="w-full mt-1 p-2 border rounded-md"><option value="Mexico">Mexico</option><option value="Spain">Spain</option></select>
                        </div>
                        <div>
                            <label class="font-semibold">Formality</label>
                            <select id="formality-select" class="w-full mt-1 p-2 border rounded-md"><option value="Casual">Casual</option><option value="Formal">Formal</option></select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const dialectSelect = document.getElementById('dialect-select');
        const formalitySelect = document.getElementById('formality-select');
        const micBtn = document.getElementById('mic-btn');
        const reportModal = document.getElementById('report-modal');
        const closeReportBtn = document.getElementById('close-report-btn');
        const endSessionBtn = document.getElementById('end-session-btn');
        const translationPopover = document.getElementById('translation-popover');

        showSignupBtn.addEventListener('click', () => { loginView.classList.add('hidden'); signupView.classList.remove('hidden'); });
        showLoginBtn.addEventListener('click', () => { signupView.classList.add('hidden'); loginView.classList.remove('hidden'); });

        loginBtn.addEventListener('click', async () => { /* ... (unchanged) ... */ });
        signupBtn.addEventListener('click', async () => { /* ... (unchanged) ... */ });
        logoutBtn.addEventListener('click', () => signOut(auth));
        const setupNewUser = async (user) => { /* ... (unchanged) ... */ };
        const loadUserSettings = async (userId) => { /* ... (unchanged) ... */ };
        const saveUserSettings = async (userId, settings) => { /* ... (unchanged) ... */ };
        const updateSetting = (key, value) => { /* ... (unchanged) ... */ };
        onAuthStateChanged(auth, async (user) => { /* ... (unchanged) ... */ });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'es-ES';
            recognition.interimResults = false;

            recognition.onstart = () => { isListening = true; micBtn.classList.add('mic-active'); };
            recognition.onresult = (event) => { chatInput.value = event.results[0][0].transcript; };
            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                alert(`Speech recognition error: ${event.error}. Please ensure microphone access is allowed.`);
            };
            recognition.onend = () => { isListening = false; micBtn.classList.remove('mic-active'); };
        }
        
        const speak = (textToSpeak) => { /* ... (unchanged) ... */ };
        const AIManager = { /* ... (unchanged) ... */ };
        const missions = [ /* ... (unchanged) ... */ ];
        const renderMissions = () => { /* ... (unchanged) ... */ };
        const startChat = (missionIndex) => { /* ... (unchanged) ... */ };
        const addMessage = (text, role) => { /* ... (unchanged) ... */ };
        const addTypingIndicator = () => { /* ... (unchanged) ... */ };
        const removeTypingIndicator = () => { /* ... (unchanged) ... */ };
        const handleSendMessage = async () => { /* ... (unchanged) ... */ };
        const showReport = async () => { /* ... (unchanged) ... */ };

        endSessionBtn.addEventListener('click', showReport);
        closeReportBtn.addEventListener('click', () => { /* ... (unchanged) ... */ });
        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        dialectSelect.addEventListener('change', (e) => updateSetting('dialect', e.target.value));
        formalitySelect.addEventListener('change', (e) => updateSetting('formality', e.target.value));
        sendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleSendMessage());
        
        missionView.addEventListener('click', (e) => {
            const card = e.target.closest('.mission-card');
            if (card && !e.target.closest('.toggle-checkbox, .toggle-label')) {
                startChat(card.dataset.index);
            }
        });
        
        micBtn.addEventListener('click', () => {
            if (!recognition) {
                return alert("Sorry, your browser doesn't support speech recognition.");
            }
            if (isListening) {
                recognition.stop();
                return;
            }
            try { recognition.start(); } 
            catch(e) { console.error("Could not start recognition:", e); alert("Could not start speech recognition."); }
        });

        chatContainer.addEventListener('click', async (e) => {
            const target = e.target;
            
            if (target.classList.contains('read-aloud-btn')) {
                const bubble = target.closest('.flex-col').querySelector('.chat-bubble');
                if (bubble) speak(bubble.textContent.trim());
            }
            
            if (target.classList.contains('correction-btn')) {
                const bubble = target.closest('.flex-col').querySelector('.chat-bubble');
                if (bubble) {
                    const originalText = bubble.textContent.trim();
                    target.textContent = 'Correcting...';
                    const correction = await AIManager.getCorrection(originalText);
                    alert(correction);
                    target.textContent = 'Correct me ✨';
                }
            }
            
            if (target.classList.contains('clickable-word')) {
                const word = target.textContent.trim().replace(/[.,¡!¿?]/g, '');
                if (!word) return;
                const context = target.parentElement.textContent.trim();
                
                translationPopover.innerHTML = 'Translating...';
                translationPopover.classList.remove('hidden');
                
                const rect = target.getBoundingClientRect();
                const containerRect = document.getElementById('app-container').getBoundingClientRect();
                
                translationPopover.style.left = `${rect.left - containerRect.left + rect.width / 2}px`;
                translationPopover.style.transform = 'translateX(-50%)';
                translationPopover.style.top = `${rect.top - containerRect.top - 10}px`; 

                const translation = await AIManager.getTranslation(word, context);
                translationPopover.innerHTML = translation ? translation.replace(/\n/g, '<br>') : 'Error translating.';
                
                translationPopover.style.top = `${rect.top - containerRect.top - translationPopover.offsetHeight - 5}px`;
            }
        });

        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('clickable-word')) {
                translationPopover.classList.add('hidden');
            }
        }, true);

        renderMissions();
