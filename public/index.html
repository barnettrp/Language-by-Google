<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConvoQuest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- === FIREBASE CONFIGURATION === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, serverTimestamp, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxVns7LxAG2WMkuUu8JOfgx7bE-6MycBY",
            authDomain: "spanish-ai-project.firebaseapp.com",
            projectId: "spanish-ai-project",
            storageBucket: "spanish-ai-project.appspot.com",
            messagingSenderId: "788393465858",
            appId: "1:788393465858:web:ad0770073d59fa88a7af1b"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseInstances = { app, auth: getAuth(app), db: getFirestore(app) };
        window.firebaseFunctions = { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, doc, setDoc, getDoc, serverTimestamp, updateDoc, increment };
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; overflow: hidden; }
        .contained-area { background: rgba(255, 255, 255, 0.80); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .auth-input, #chat-input { font-size: 16px; }
        @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-content, .hint-popover, #translation-popover { animation: pop-in 0.3s ease-out forwards; }
        .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
        .chat-bubble-user { background-color: #3b82f6; color: white; }
        .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        .map-location { cursor: pointer; transition: transform 0.2s; }
        .map-location:hover { transform: scale(1.1); }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-0 md:p-4">

    <div id="app-container" class="w-full h-full md:max-w-lg md:h-[90vh] md:max-h-[700px] contained-area rounded-none md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
        
        <div id="auth-container" class="flex flex-col h-full p-6 justify-center">
            <div id="login-view">
                <div class="flex justify-center mb-4">
                    <svg class="h-16 w-16 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        <line x1="10" y1="12" x2="14" y2="8"></line><line x1="14" y1="12" x2="10" y2="16"></line><line x1="12" y1="10" x2="12" y2="10"></line>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome to ConvoQuest</h1>
                <div class="space-y-4">
                    <input type="email" id="login-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="login-password-input" placeholder="Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <p id="login-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
                <div class="mt-4 space-y-2">
                    <button id="login-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Log In</button>
                    <button id="show-signup-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Don't have an account? Sign Up</button>
                </div>
            </div>
            <div id="signup-view" class="hidden">
                <div class="flex justify-center mb-4">
                     <svg class="h-16 w-16 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        <line x1="10" y1="12" x2="14" y2="8"></line><line x1="14" y1="12" x2="10" y2="16"></line><line x1="12" y1="10" x2="12" y2="10"></line>
                    </svg>
                </div>
                <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h1>
                <div class="space-y-4">
                    <input type="text" id="signup-name-input" placeholder="Name" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="email" id="signup-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="signup-password-input" placeholder="Password (min. 6 characters)" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="password" id="signup-confirm-password-input" placeholder="Confirm Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <p id="signup-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
                <div class="mt-4 space-y-2">
                    <button id="signup-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Create Account</button>
                    <button id="show-login-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Already have an account? Log In</button>
                </div>
            </div>
        </div>
        
        <div id="main-app-view" class="hidden flex-col h-full">
            <div id="quest-view" class="flex flex-col h-full">
                <header class="p-4 border-b border-gray-200/80 flex justify-between items-center flex-shrink-0">
                    <h1 id="welcome-message" class="text-xl font-bold text-gray-800">Choose a Quest</h1>
                    <div>
                        <button id="settings-btn" title="Settings" class="text-gray-500 hover:text-gray-800 transition-colors inline-flex items-center justify-center h-8 w-8">
                           <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0 3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                        </button>
                        <button id="logout-btn" title="Log Out" class="text-gray-500 hover:text-red-500 transition-colors inline-flex items-center justify-center h-8 w-8">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                        </button>
                    </div>
                </header>
                <div class="p-4 space-y-3 overflow-y-auto"></div>
            </div>
            <div id="chat-view" class="hidden flex-col h-full">
                <header class="p-4 border-b border-gray-200/80 flex justify-between items-center flex-shrink-0">
                    <div>
                        <h1 id="chat-title" class="text-xl font-bold text-gray-800"></h1>
                        <p id="chat-description" class="text-sm text-gray-500"></p>
                    </div>
                    <button id="end-session-btn" class="bg-blue-500 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-blue-600 transition-colors">Complete Stage</button>
                </header>
                <div id="chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
                <div id="translation-popover" class="hidden absolute bg-black text-white text-xs rounded py-1 px-2 z-10 shadow-lg text-center"></div>
                <div id="hint-popover" class="hidden absolute bottom-20 left-1/2 -translate-x-1/2 bg-white p-2 rounded-lg shadow-lg cursor-pointer hint-popover z-10">
                    <p class="text-sm text-gray-700"></p>
                </div>
                <footer class="p-4 border-t border-gray-200/80 flex-shrink-0">
                    <div class="flex items-center space-x-2">
                         <button id="hint-btn" class="text-gray-500 hover:text-yellow-500 rounded-full p-3 transition-colors">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                        </button>
                        <input type="text" id="chat-input" placeholder="Type or tap the mic..." class="flex-1 p-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button id="mic-btn" class="text-gray-500 hover:text-blue-500 rounded-full p-3 transition-colors">
                            <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4z" /><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM2 10a2 2 0 114 0v1a2 2 0 11-4 0v-1zm14-1a2 2 0 10-4 0v1a2 2 0 104 0v-1z" clip-rule="evenodd" /></svg>
                        </button>
                        <button id="send-btn" class="bg-blue-500 text-white rounded-full p-3 hover:bg-blue-600 transition-colors">
                            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
                        </button>
                    </div>
                </footer>
            </div>
            
            <div id="report-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md modal-content">
                     <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Session Report</h2><button id="close-report-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                    <div id="report-content" class="space-y-4"></div>
                    <div id="report-loading" class="hidden text-center"><p>✨ Analyzing your conversation...</p></div>
                </div>
            </div>
            <div id="settings-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                 <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md modal-content">
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Settings</h2><button id="close-settings-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                    <div class="space-y-4">
                        <div>
                            <label class="font-semibold">Dialect</label>
                            <select id="dialect-select" class="w-full mt-1 p-2 border rounded-md"><option value="Mexico">Mexico</option><option value="Spain">Spain</option></select>
                        </div>
                        <div>
                            <label class="font-semibold">Formality</label>
                            <select id="formality-select" class="w-full mt-1 p-2 border rounded-md"><option value="Casual">Casual</option><option value="Formal">Formal</option></select>
                        </div>
                        <div>
                            <label for="vignette-lang-select" class="font-semibold">Quest Intro Language</label>
                            <select id="vignette-lang-select" class="w-full mt-1 p-2 border rounded-md">
                                <option value="English">English</option>
                                <option value="Spanish">Spanish</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div id="vignette-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md text-center modal-content">
                    <h2 id="vignette-title" class="text-2xl font-bold mb-4"></h2>
                    <p id="vignette-text" class="text-gray-600 mb-6"></p>
                    <button id="start-stage-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Begin Conversation</button>
                </div>
            </div>
            <div id="map-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md text-center modal-content">
                    <h2 id="map-title" class="text-2xl font-bold mb-2">Quest Objective</h2>
                    <p id="map-objective" class="text-gray-600 mb-4"></p>
                    <div id="map-container" class="relative bg-gray-200 rounded-lg overflow-hidden">
                        <img id="map-image" src="https://placehold.co/600x400/E2E8F0/A0AEC0?text=Map" class="w-full h-auto">
                    </div>
                </div>
            </div>
            <div id="stage-complete-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
                <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md text-center modal-content">
                    <h2 class="text-2xl font-bold text-green-600 mb-2">Objective Complete!</h2>
                    <p class="text-gray-700 mb-4">You found a new clue:</p>
                    <div id="clue-card" class="bg-yellow-100 border border-yellow-300 rounded-lg p-4 mb-4">
                        <p id="clue-text" class="font-semibold text-yellow-800"></p>
                    </div>
                    <p id="xp-gain-text" class="text-lg font-semibold text-blue-600 mb-6"></p>
                    <button id="continue-quest-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Continue Quest</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const { auth, db } = window.firebaseInstances;
        const { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, updateProfile, doc, setDoc, getDoc, serverTimestamp, updateDoc, increment } = window.firebaseFunctions;

        let currentUser = null;
        let userSettings = { dialect: 'Mexico', formality: 'Casual', vignetteLanguage: 'English', xp: 0, completedStages: {} };
        let signupName = '';
        let isListening = false;
        
        const authContainer = document.getElementById('auth-container');
        const mainAppView = document.getElementById('main-app-view');
        const loginView = document.getElementById('login-view');
        const loginEmailInput = document.getElementById('login-email-input');
        const loginPasswordInput = document.getElementById('login-password-input');
        const loginBtn = document.getElementById('login-btn');
        const showSignupBtn = document.getElementById('show-signup-btn');
        const loginError = document.getElementById('login-error');
        const signupView = document.getElementById('signup-view');
        const signupNameInput = document.getElementById('signup-name-input');
        const signupEmailInput = document.getElementById('signup-email-input');
        const signupPasswordInput = document.getElementById('signup-password-input');
        const signupConfirmPasswordInput = document.getElementById('signup-confirm-password-input');
        const signupBtn = document.getElementById('signup-btn');
        const showLoginBtn = document.getElementById('show-login-btn');
        const signupError = document.getElementById('signup-error');
        const logoutBtn = document.getElementById('logout-btn');
        const welcomeMessage = document.getElementById('welcome-message');
        const questView = document.getElementById('quest-view');
        const chatView = document.getElementById('chat-view');
        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const dialectSelect = document.getElementById('dialect-select');
        const formalitySelect = document.getElementById('formality-select');
        const micBtn = document.getElementById('mic-btn');
        const reportModal = document.getElementById('report-modal');
        const closeReportBtn = document.getElementById('close-report-btn');
        const endSessionBtn = document.getElementById('end-session-btn');
        const translationPopover = document.getElementById('translation-popover');
        const vignetteModal = document.getElementById('vignette-modal');
        const vignetteTitle = document.getElementById('vignette-title');
        const vignetteText = document.getElementById('vignette-text');
        const startStageBtn = document.getElementById('start-stage-btn');
        const vignetteLangSelect = document.getElementById('vignette-lang-select');
        const mapModal = document.getElementById('map-modal');
        const mapTitle = document.getElementById('map-title');
        const mapObjective = document.getElementById('map-objective');
        const mapContainer = document.getElementById('map-container');
        const stageCompleteModal = document.getElementById('stage-complete-modal');
        const clueText = document.getElementById('clue-text');
        const xpGainText = document.getElementById('xp-gain-text');
        const continueQuestBtn = document.getElementById('continue-quest-btn');
        const hintBtn = document.getElementById('hint-btn');
        const hintPopover = document.getElementById('hint-popover');

        const translationCache = new Map();
        
        const localDictionary = {
            "hola": "hello", "adiós": "goodbye", "gracias": "thank you", "por": "for/by", "favor": "please",
            "sí": "yes", "no": "no", "qué": "what", "cómo": "how", "dónde": "where", "quién": "who", "cuándo": "when",
            "yo": "I", "tú": "you", "él": "he", "ella": "she", "nosotros": "we", "ellos": "they", "ellas": "they",
            "estoy": "I am", "estás": "you are", "es": "is", "somos": "we are", "son": "are", "ser": "to be", "estar": "to be",
            "tengo": "I have", "tienes": "you have", "tiene": "has", "tenemos": "we have", "tienen": "have", "tener": "to have",
            "quiero": "I want", "quieres": "you want", "quiere": "wants", "queremos": "we want", "quieren": "want", "querer": "to want",
            "un": "a/an", "una": "a/an", "el": "the", "la": "the", "los": "the", "las": "the",
            "a": "to/at", "de": "of/from", "en": "in/on", "con": "with", "sin": "without",
            "buenos": "good", "días": "days", "tardes": "afternoons", "noches": "nights",
            "nombre": "name", "mi": "my", "me": "me", "llamo": "I call myself",
            "y": "and", "o": "or", "pero": "but", "porque": "because",
            "café": "coffee", "agua": "water", "comida": "food", "cuenta": "bill",
            "hotel": "hotel", "aeropuerto": "airport", "calle": "street", "plaza": "plaza",
            "amigo": "friend", "amiga": "friend", "familia": "family", "ayuda": "help",
            "bien": "well", "mal": "bad", "mucho": "a lot", "poco": "a little",
            "ahora": "now", "hoy": "today", "mañana": "tomorrow", "siempre": "always",
            "necesito": "I need", "puedo": "I can", "voy": "I go", "hay": "there is/are"
        };
        
        showSignupBtn.addEventListener('click', () => { loginView.classList.add('hidden'); signupView.classList.remove('hidden'); });
        showLoginBtn.addEventListener('click', () => { signupView.classList.add('hidden'); loginView.classList.remove('hidden'); });
        
        loginBtn.addEventListener('click', async () => {
            loginError.textContent = '';
            const email = loginEmailInput.value.trim();
            const password = loginPasswordInput.value.trim();
            if (!email || !password) { loginError.textContent = "Please enter an email and password."; return; }
            try { await signInWithEmailAndPassword(auth, email, password); } 
            catch (error) { loginError.textContent = error.message; }
        });

        signupBtn.addEventListener('click', async () => {
            signupError.textContent = '';
            const name = signupNameInput.value.trim();
            const email = signupEmailInput.value.trim();
            const password = signupPasswordInput.value.trim();
            const confirmPassword = signupConfirmPasswordInput.value.trim();
            if (!name || !email || !password || !confirmPassword) { signupError.textContent = "Please fill out all fields."; return; }
            if (password.length < 6) { signupError.textContent = "Password must be at least 6 characters."; return; }
            if (password !== confirmPassword) { signupError.textContent = "Passwords do not match."; return; }
            signupName = name;
            try { await createUserWithEmailAndPassword(auth, email, password); } 
            catch (error) { signupError.textContent = error.message; signupName = ''; }
        });
        
        logoutBtn.addEventListener('click', () => signOut(auth));

        const setupNewUser = async (user) => {
            await updateProfile(user, { displayName: signupName });
            const userDocRef = doc(db, 'users', user.uid);
            const initialSettings = { name: signupName, email: user.email, createdAt: serverTimestamp(), dialect: 'Mexico', formality: 'Casual', vignetteLanguage: 'English', xp: 0, completedStages: {} };
            await setDoc(userDocRef, initialSettings);
            signupName = '';
            return initialSettings;
        };

        const loadUserSettings = async (userId) => {
            const userDocRef = doc(db, 'users', userId);
            const docSnap = await getDoc(userDocRef);
            if (docSnap.exists() && docSnap.data()) {
                userSettings = { ...userSettings, ...docSnap.data() };
            }
            dialectSelect.value = userSettings.dialect;
            formalitySelect.value = userSettings.formality;
            vignetteLangSelect.value = userSettings.vignetteLanguage;
        };
        
        const saveUserSettings = async (userId, settings) => {
            if (!userId) return;
            const userDocRef = doc(db, 'users', userId);
            await updateDoc(userDocRef, settings);
        };
        
        const updateSetting = (key, value) => {
            userSettings[key] = value;
            if (currentUser) { saveUserSettings(currentUser.uid, { [key]: value }); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const isNewUser = user.metadata.creationTime === user.metadata.lastSignInTime;
                if (isNewUser && signupName) { userSettings = await setupNewUser(user); } 
                else { await loadUserSettings(user.uid); }
                welcomeMessage.textContent = `Welcome, ${user.displayName || userSettings.name || 'Friend'}!`;
                authContainer.style.display = 'none';
                mainAppView.classList.remove('hidden');
                mainAppView.classList.add('flex');
                questView.style.display = 'flex';
                chatView.classList.add('hidden');
                chatView.classList.remove('flex');
            } else {
                currentUser = null;
                authContainer.style.display = 'flex';
                signupView.classList.add('hidden');
                loginView.classList.remove('hidden');
                mainAppView.classList.add('hidden');
                mainAppView.classList.remove('flex');
            }
        });

        let currentQuest = null;
        let currentStage = null;
        let messages = [];
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'es-ES';
            recognition.interimResults = false;
            recognition.onstart = () => { isListening = true; micBtn.classList.add('mic-active'); };
            recognition.onresult = (event) => { chatInput.value = event.results[0][0].transcript; };
            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                alert(`Speech recognition error: ${event.error}. Please ensure microphone access is allowed.`);
            };
            recognition.onend = () => { isListening = false; micBtn.classList.remove('mic-active'); };
        }
        
        const speak = (textToSpeak) => {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Sorry, your browser doesn't support text-to-speech.");
            }
        };

        const AIManager = {
            async callAPI(payload) {
                try {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) { return { error: "Sorry, I encountered an error." }; }
                    return await response.json();
                } catch (error) { return { error: "Sorry, I couldn't connect to the AI." }; }
            },
            async getResponse(history, stage, settings) {
                const mappedHistory = history.map(m => ({ role: m.role === 'ai' ? 'model' : 'user', parts: m.parts }));
                const payload = { type: 'chat', history: mappedHistory, stage, settings };
                const response = await this.callAPI(payload);
                return response.text || response.error;
            },
            async validateObjective(transcript, validationPrompt) {
                const payload = { type: 'validation', transcript, validationPrompt };
                const response = await this.callAPI(payload);
                return response.text || "NO";
            },
            async getCorrection(text) {
                const payload = { type: 'correction', text };
                const response = await this.callAPI(payload);
                return response.text || response.error;
            },
            async analyzeConversation(transcript) {
                const payload = { type: 'analysis', transcript };
                const response = await this.callAPI(payload);
                return response.data || { error: response.error };
            },
            async getTranslation(word, context) {
                const payload = { type: 'translation', word, context };
                const response = await this.callAPI(payload);
                return response.text || response.error;
            },
            async getHint(history, stage) {
                const mappedHistory = history.map(m => ({ role: m.role === 'ai' ? 'model' : 'user', parts: m.parts }));
                const payload = { type: 'hint', history: mappedHistory, stage };
                const response = await this.callAPI(payload);
                return response.text || "Try asking a question.";
            }
        };

        const quests = {
            "missing-guitar": {
                title: "The Missing Guitar",
                objective: "A famous musician's guitar is missing. Find it before his show!",
                mapImage: "https://images.unsplash.com/photo-1519750783826-e2420f4d687f?q=80&w=1887&auto=format&fit=crop",
                stages: {
                    "1": {
                        characterName: "Mateo, the Concierge",
                        vignette_en: "You're in a hotel lobby. The concierge, Mateo, looks worried. Your goal: Find out who the musician is and where he was last seen.",
                        vignette_es: "Estás en el vestíbulo de un hotel. El conserje, Mateo, parece preocupado. Tu objetivo: Averiguar quién es el músico y dónde fue visto por última vez.",
                        systemPrompt: "You are Mateo, a professional but worried hotel concierge in Bogotá.",
                        validationPrompt: "Did the user find out the musician's name is 'Carlos' and he was last seen at the 'plaza'?",
                        reward: { clue: "Musician 'Carlos' was last seen at the plaza.", xp: 50 },
                        nextStages: ["2a", "2b"],
                        initialMessage: "Good morning. How can I help you today?"
                    },
                    "2a": {
                        characterName: "Elena, the Vendor",
                        vignette_en: "You arrive at the bustling plaza. A street vendor, Elena, seems to know everyone. Your goal: Ask her if she saw Carlos.",
                        vignette_es: "Llegas a la bulliciosa plaza. Una vendedora ambulante, Elena, parece conocer a todo el mundo. Tu objetivo: Pregúntale si vio a Carlos.",
                        systemPrompt: "You are Elena, a chatty and knowledgeable street vendor in a plaza.",
                        validationPrompt: "Did the user learn that Carlos was talking to another musician named Javier?",
                        reward: { clue: "Carlos was seen with a rival musician, Javier.", xp: 75 },
                        nextStages: ["3"],
                        initialMessage: "¡Hola! ¿Buscas algo bonito?"
                    },
                    "2b": {
                        characterName: "A Lost Tourist",
                        vignette_en: "You see a tourist taking photos. They look lost. Your goal: Ask them if they saw anything unusual.",
                        vignette_es: "Ves a un turista tomando fotos. Parece perdido. Tu objetivo: Pregúntale si vio algo inusual.",
                        systemPrompt: "You are a lost tourist who speaks very little Spanish and saw nothing useful.",
                        validationPrompt: "Did the user learn that you saw nothing useful?",
                        reward: { clue: "The tourist saw nothing. This is a dead end.", xp: 10 },
                        nextStages: ["2a"],
                        initialMessage: "Uh... hello? Do you speak English?"
                    },
                     "3": {
                        characterName: "Javier, the Rival",
                        vignette_en: "You find Javier in an alley. He looks nervous. Your goal: Convince him to return the guitar.",
                        vignette_es: "Encuentras a Javier en un callejón. Parece nervioso. Tu objetivo: Convencerlo de que devuelva la guitarra.",
                        systemPrompt: "You are Javier, a jealous rival musician. You 'borrowed' the guitar but won't admit it easily.",
                        validationPrompt: "Did the user successfully convince you to return the guitar?",
                        reward: { clue: "You convinced Javier! The guitar is safe.", xp: 100 },
                        nextStages: [],
                        initialMessage: "¿Qué quieres? Estoy ocupado."
                    }
                }
            }
        };

        const renderQuests = () => {
            const questList = questView.querySelector('.space-y-3');
            questList.innerHTML = Object.keys(quests).map(questId => {
                const quest = quests[questId];
                return `<div class="p-4 border rounded-lg hover:bg-gray-50 cursor-pointer quest-card" data-quest-id="${questId}">
                            <h3 class="font-semibold">${quest.title}</h3>
                            <p class="text-sm text-gray-600">${quest.objective}</p>
                        </div>`;
            }).join('');
        };
        
        const showMapView = (questId) => {
            currentQuest = { ...quests[questId], id: questId };
            mapTitle.textContent = currentQuest.title;
            mapObjective.textContent = currentQuest.objective;
            
            document.getElementById('map-image').src = currentQuest.mapImage;
            
            mapContainer.querySelectorAll('.map-location').forEach(el => el.remove());
            
            const nextStageIds = currentStage ? currentStage.nextStages : ["1"];

            nextStageIds.forEach((stageId, index) => {
                const location = document.createElement('div');
                location.className = 'map-location absolute p-2 bg-white/80 rounded-full shadow-lg';
                location.style.left = `${20 + index * 40}%`;
                location.style.top = `${40 + (index % 2 * 15)}%`;
                location.innerHTML = `<span>📍</span>`;
                location.dataset.questId = questId;
                location.dataset.stageId = stageId;
                mapContainer.appendChild(location);
            });
            
            mapModal.classList.remove('hidden');
        };

        const showVignette = (questId, stageId) => {
            currentQuest = { ...quests[questId], id: questId };
            currentStage = { ...currentQuest.stages[stageId], id: stageId, questId: questId };
            vignetteTitle.textContent = currentStage.characterName;
            vignetteText.textContent = userSettings.vignetteLanguage === 'Spanish' ? currentStage.vignette_es : currentStage.vignette_en;
            vignetteModal.classList.remove('hidden');
        };
        
        const startStage = () => { 
            if (!currentStage) return;
            messages = [];
            chatView.querySelector('#chat-title').textContent = currentStage.characterName;
            chatView.querySelector('#chat-description').textContent = currentStage.vignette_en.split('.')[1];
            addMessage(currentStage.initialMessage, 'ai');
            vignetteModal.classList.add('hidden');
            questView.style.display = 'none';
            chatView.classList.remove('hidden');
            chatView.classList.add('flex');
        };
        
        const addMessage = (text, role) => {
            messages.push({ role, parts: [{ text }] });
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `w-full flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
            const bubbleWrapper = document.createElement('div');
            bubbleWrapper.className = `chat-bubble p-3 rounded-lg w-fit ${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'}`;
            text.split(' ').forEach(word => {
                const wordSpan = document.createElement('span');
                wordSpan.className = 'clickable-word cursor-pointer hover:underline';
                wordSpan.textContent = word + ' ';
                bubbleWrapper.appendChild(wordSpan);
            });
            wrapper.appendChild(bubbleWrapper);
            if (isUser) {
                wrapper.innerHTML += `<button title="Correct me" class="correction-btn text-xs text-gray-500 hover:text-blue-500 mt-1 mr-1">Correct me ✨</button>`;
            } else {
                wrapper.innerHTML += `<button title="Read aloud" class="read-aloud-btn text-xs text-gray-500 hover:text-blue-500 mt-1 ml-1">Read Aloud 🔊</button>`;
            }
            chatContainer.insertBefore(wrapper, chatContainer.firstChild);
        };
        
        const handleSendMessage = async () => {
            const userInput = chatInput.value.trim();
            if (!userInput) return;
            addMessage(userInput, 'user');
            chatInput.value = '';
            addTypingIndicator();
            const response = await AIManager.getResponse(messages.slice(-6), currentStage, userSettings);
            removeTypingIndicator();
            addMessage(response, 'ai');
        };
        
        const addTypingIndicator = () => {
            const indicator = document.createElement('div');
            indicator.id = 'typing-indicator';
            indicator.className = 'flex justify-start';
            indicator.innerHTML = `<div class="chat-bubble-ai p-3 rounded-lg w-fit flex items-center gap-1.5"><span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></span><span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></span><span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></span></div>`;
            chatContainer.insertBefore(indicator, chatContainer.firstChild);
        };
        const removeTypingIndicator = () => document.getElementById('typing-indicator')?.remove();

        const endStage = async () => {
            const transcript = messages.map(m => `${m.role === 'user' ? 'User' : 'Tutor'}: ${m.parts[0].text}`).join('\n');
            const result = await AIManager.validateObjective(transcript, currentStage.validationPrompt);

            if (result.trim().toUpperCase() === "YES") {
                const stageKey = `${currentStage.questId}-${currentStage.id}`;
                if (!userSettings.completedStages[stageKey]) {
                    clueText.textContent = currentStage.reward.clue;
                    xpGainText.textContent = `+${currentStage.reward.xp} XP`;
                    userSettings.xp += currentStage.reward.xp;
                    userSettings.completedStages[stageKey] = true;
                    saveUserSettings(currentUser.uid, { xp: increment(currentStage.reward.xp), completedStages: userSettings.completedStages });
                    stageCompleteModal.classList.remove('hidden');
                } else {
                    chatView.classList.add('hidden');
                    questView.style.display = 'flex';
                    showMapView(currentStage.questId);
                }
            } else {
                alert("Objective not met. Try asking again in a different way.");
            }
        };

        const showHint = async () => {
            hintBtn.disabled = true;
            hintPopover.querySelector('p').textContent = 'Getting hint...';
            hintPopover.classList.remove('hidden');

            const hint = await AIManager.getHint(messages.slice(-6), currentStage);
            
            hintPopover.querySelector('p').textContent = hint;
            hintBtn.disabled = false;
        };

        questView.addEventListener('click', (e) => {
            const card = e.target.closest('.quest-card');
            if(card) showMapView(card.dataset.questId);
        });
        
        mapContainer.addEventListener('click', (e) => {
            const location = e.target.closest('.map-location');
            if(location) {
                mapModal.classList.add('hidden');
                showVignette(location.dataset.questId, location.dataset.stageId);
            }
        });
        
        startStageBtn.addEventListener('click', startStage);
        continueQuestBtn.addEventListener('click', () => {
            stageCompleteModal.classList.add('hidden');
            chatView.classList.add('hidden');
            questView.style.display = 'flex';
            if (currentStage.nextStages.length > 0) {
                showMapView(currentStage.questId);
            } else {
                alert("Quest Complete! 🎉");
            }
        });
        endSessionBtn.addEventListener('click', endStage);

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        vignetteLangSelect.addEventListener('change', (e) => updateSetting('vignetteLanguage', e.target.value));
        dialectSelect.addEventListener('change', (e) => updateSetting('dialect', e.target.value));
        formalitySelect.addEventListener('change', (e) => updateSetting('formality', e.target.value));
        sendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleSendMessage());
        
        micBtn.addEventListener('click', () => {
            if (!recognition) { return alert("Sorry, your browser doesn't support speech recognition."); }
            if (isListening) { recognition.stop(); return; }
            try { recognition.start(); } 
            catch(e) { console.error("Could not start recognition:", e); alert("Could not start speech recognition. Please check permissions."); }
        });
        
        chatContainer.addEventListener('click', async (e) => {
            const target = e.target;
            
            if (target.classList.contains('read-aloud-btn')) {
                const bubble = target.closest('.flex-col').querySelector('.chat-bubble');
                if (bubble) speak(bubble.textContent.trim());
            }
            
            if (target.classList.contains('correction-btn')) {
                const bubble = target.closest('.flex-col').querySelector('.chat-bubble');
                if (bubble) {
                    const originalText = bubble.textContent.trim();
                    target.textContent = 'Correcting...';
                    const correction = await AIManager.getCorrection(originalText);
                    alert(correction);
                    target.textContent = 'Correct me ✨';
                }
            }
            
            if (target.classList.contains('clickable-word')) {
                const word = target.textContent.trim().replace(/[.,¡!¿?]/g, '').toLowerCase();
                if (!word) return;
                
                const showTranslation = (translationText) => {
                    translationPopover.innerHTML = translationText;
                    const containerRect = document.getElementById('app-container').getBoundingClientRect();
                    const rect = target.getBoundingClientRect();
                    const popoverRect = translationPopover.getBoundingClientRect();
                    let left = rect.left - containerRect.left + (rect.width / 2) - (popoverRect.width / 2);
                    let top = rect.top - containerRect.top - popoverRect.height - 8;
                    if (left < 8) left = 8;
                    if (left + popoverRect.width > containerRect.width - 8) {
                        left = containerRect.width - popoverRect.width - 8;
                    }
                    if (top < 8) {
                        top = rect.bottom - containerRect.top + 8;
                    }
                    translationPopover.style.left = `${left}px`;
                    translationPopover.style.top = `${top}px`;
                    translationPopover.classList.remove('hidden');
                };

                if (translationCache.has(word)) {
                    showTranslation(translationCache.get(word));
                } else if (localDictionary[word]) {
                    const translation = localDictionary[word];
                    translationCache.set(word, translation);
                    showTranslation(translation);
                } else {
                    showTranslation('Translating...');
                    const context = target.parentElement.textContent.trim();
                    const apiTranslation = await AIManager.getTranslation(word, context);
                    const formattedTranslation = apiTranslation ? apiTranslation.replace(/\n/g, '<br>') : 'Not found.';
                    translationCache.set(word, formattedTranslation);
                    showTranslation(formattedTranslation);
                }
            }
        });
        
        hintBtn.addEventListener('click', showHint);
        hintPopover.addEventListener('click', () => {
            const hintText = hintPopover.querySelector('p').textContent;
            if (hintText && hintText !== 'Getting hint...') {
                chatInput.value = hintText;
                hintPopover.classList.add('hidden');
                chatInput.focus();
            }
        });

        document.body.addEventListener('click', (e) => {
            if (!e.target.classList.contains('clickable-word') && !e.target.closest('#hint-btn')) {
                translationPopover.classList.add('hidden');
                hintPopover.classList.add('hidden');
            }
        }, true);
        
        renderQuests();
    });
    </script>
</body>
</html>
