<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Language Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- === FIREBASE CONFIGURATION === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDxVns7LxAG2WMkuUu8JOfgx7bE-6MycBY",
            authDomain: "spanish-ai-project.firebaseapp.com",
            projectId: "spanish-ai-project",
            storageBucket: "spanish-ai-project.appspot.com",
            messagingSenderId: "788393465858",
            appId: "1:788393465858:web:ad0770073d59fa88a7af1b"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseInstances = {
            app: app,
            auth: getAuth(app),
            db: getFirestore(app)
        };
        window.firebaseFunctions = {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            doc,
            setDoc,
            getDoc
        };
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; overflow: hidden; }
        @keyframes pop-in { 0% { transform: scale(0.95) translateY(10px); opacity: 0; } 100% { transform: scale(1) translateY(0px); opacity: 1; } }
        .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
        .chat-bubble-user { background-color: #3b82f6; color: white; }
        .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
        .contained-area { background: rgba(255, 255, 255, 0.80); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
        #chat-input, .auth-input { font-size: 16px; }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-0 md:p-4">

    <div id="app-container" class="w-full h-full md:max-w-lg md:h-[90vh] md:max-h-[700px] contained-area rounded-none md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Auth View -->
        <div id="auth-view" class="flex flex-col h-full p-6 justify-center">
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Language Tutor</h1>
            <div class="space-y-4">
                <input type="email" id="email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="password-input" placeholder="Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <p id="auth-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
            <div class="mt-4 space-y-2">
                <button id="login-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Log In</button>
                <button id="signup-btn" class="w-full bg-gray-200 text-gray-700 p-3 rounded-md font-semibold hover:bg-gray-300 transition-colors">Create Account</button>
            </div>
        </div>
        
        <!-- Main App View (Content is the same as before) -->
        <div id="main-app-view" class="hidden flex-col h-full">
            <!-- ... (The rest of your app's HTML is unchanged) ... -->
        </div>
    </div>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const { auth, db } = window.firebaseInstances;
        const { createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, doc, setDoc, getDoc } = window.firebaseFunctions;

        // --- DOM ELEMENT REFERENCES ---
        const authView = document.getElementById('auth-view');
        const mainAppView = document.getElementById('main-app-view');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const signupBtn = document.getElementById('signup-btn');
        const authError = document.getElementById('auth-error');
        // ... (other element references)

        // --- AUTHENTICATION LOGIC ---
        const showAuthError = (message) => { authError.textContent = message; };
        
        loginBtn.addEventListener('click', async () => {
            showAuthError('');
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // --- NEW: VALIDATION ADDED ---
            if (!email || !password) {
                showAuthError("Please enter an email and password.");
                return;
            }
            
            try { 
                await signInWithEmailAndPassword(auth, email, password); 
            } catch (error) { 
                showAuthError(error.message); 
            }
        });

        signupBtn.addEventListener('click', async () => {
            showAuthError('');
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            // --- NEW: VALIDATION ADDED ---
            if (!email || !password) {
                showAuthError("Please enter an email and password.");
                return;
            }
            if (password.length < 6) {
                showAuthError("Password must be at least 6 characters.");
                return;
            }

            try { 
                await createUserWithEmailAndPassword(auth, email, password); 
            } catch (error) { 
                showAuthError(error.message); 
            }
        });
        
        // --- The rest of your app's JavaScript (unchanged) ---
        // ...
    });
    </script>
</body>
</html>
