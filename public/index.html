<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ConvoQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      overflow: auto; 
      min-height: 100vh;
    }
    .contained-area {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-input, #chat-input, #placement-chat-input { font-size: 16px; }
    @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-content, .hint-popover, #translation-popover { animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble-user { background-color: #3b82f6; color: white; }
    .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
    #chat-container::-webkit-scrollbar, #placement-chat-container::-webkit-scrollbar { display: none; }
    #chat-container, #placement-chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .map-location { cursor: pointer; transition: transform 0.2s; }
    .map-location:hover { transform: scale(1.1); }
    .clickable-word { cursor: pointer; }
    .clickable-word:hover { background-color: rgba(59, 130, 246, 0.2); border-radius: 3px; }
    .main-view { display: none; }
    .main-view.active { display: flex; }
  </style>
</head>
<body class="flex items-start justify-center p-2 md:p-4">

  <div id="app-container" class="contained-area rounded-xl shadow-2xl flex flex-col overflow-hidden mt-10 relative">
    <!-- AUTH VIEW -->
    <div id="auth-container" class="main-view active flex-col h-full p-6 justify-center">
      <div id="login-view">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">ConvoQuest Portal</h1>
        <div class="space-y-4">
          <input type="email" id="login-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="login-password-input" placeholder="Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p id="login-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
        <div class="mt-4 space-y-2">
          <button id="login-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Log In</button>
          <button id="show-signup-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Don't have an account? Sign Up</button>
        </div>
      </div>
      <div id="signup-view" class="hidden">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h1>
        <div class="space-y-4">
          <input type="text" id="signup-name-input" placeholder="Name" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="email" id="signup-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="signup-password-input" placeholder="Password (min. 6 characters)" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p id="signup-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
        <div class="mt-4 space-y-2">
          <button id="signup-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Create Account</button>
          <button id="show-login-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Already have an account? Log In</button>
        </div>
      </div>
    </div>

    <!-- MAIN APP & OTHER VIEWS -->
    <div id="main-app-view" class="main-view flex-col h-full">
      <!-- Quest list and other main UI elements will go here -->
    </div>
    <div id="chat-view" class="main-view flex-col h-full">
        <header class="p-4 border-b border-gray-200/80 flex justify-between items-center flex-shrink-0">
          <h1 id="chat-title" class="text-xl font-bold text-gray-800">Chat</h1>
        </header>
        <div id="chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
        <div class="p-2 border-t bg-white/50 flex-shrink-0">
          <div class="flex items-center space-x-2">
            <input type="text" id="chat-input" placeholder="Type your reply..." class="flex-1 p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-btn" class="bg-blue-500 text-white px-4 py-2 rounded-md font-semibold hover:bg-blue-600 transition-colors">Send</button>
          </div>
        </div>
    </div>
    
    <!-- POPOVER -->
    <div id="translation-popover" class="hidden absolute bg-gray-800 text-white text-sm rounded-md px-3 py-1.5 z-50 shadow-lg"></div>
  </div>

  <!-- Firebase and App Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- PASTE YOUR FIREBASE CONFIGURATION OBJECT HERE ---
    const firebaseConfig = {
      apiKey: "PASTE_YOUR_API_KEY_HERE",
      authDomain: "PASTE_YOUR_AUTH_DOMAIN_HERE",
      projectId: "PASTE_YOUR_PROJECT_ID_HERE",
      storageBucket: "PASTE_YOUR_STORAGE_BUCKET_HERE",
      messagingSenderId: "PASTE_YOUR_SENDER_ID_HERE",
      appId: "PASTE_YOUR_APP_ID_HERE"
    };

    // --- PASTE YOUR API KEYS HERE ---
    const GEMINI_API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";
    const TRANSLATE_API_KEY = "PASTE_YOUR_TRANSLATE_API_KEY_HERE";

    // --- APP INITIALIZATION ---
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- MAIN APP LOGIC ---
    function main() {
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const dom = {
            authContainer: document.getElementById('auth-container'),
            mainAppView: document.getElementById('main-app-view'),
            chatView: document.getElementById('chat-view'),
            loginBtn: document.getElementById('login-btn'),
            loginEmailInput: document.getElementById('login-email-input'),
            loginPasswordInput: document.getElementById('login-password-input'),
            loginError: document.getElementById('login-error'),
            signupBtn: document.getElementById('signup-btn'),
            signupNameInput: document.getElementById('signup-name-input'),
            signupEmailInput: document.getElementById('signup-email-input'),
            signupPasswordInput: document.getElementById('signup-password-input'),
            signupError: document.getElementById('signup-error'),
            showLoginBtn: document.getElementById('show-login-btn'),
            showSignupBtn: document.getElementById('show-signup-btn'),
            loginView: document.getElementById('login-view'),
            signupView: document.getElementById('signup-view'),
            chatContainer: document.getElementById('chat-container'),
            chatInput: document.getElementById('chat-input'),
            sendBtn: document.getElementById('send-btn'),
            translationPopover: document.getElementById('translation-popover'),
            appContainer: document.getElementById('app-container'),
        };

        const AIManager = {
            async callGemini(systemPrompt, userPrompt) {
                if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("PASTE")) return "ERROR: Gemini API Key not configured.";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ role: "user", parts: [{ text: userPrompt }] }],
                            systemInstruction: { role: "system", parts: [{ text: systemPrompt }] },
                        })
                    });
                    if (!response.ok) { const err = await response.json(); return `Error: ${err.error.message}`; }
                    const result = await response.json();
                    return result.candidates[0].content.parts[0].text;
                } catch (error) { return "Sorry, could not connect to AI service."; }
            },
            async getTranslation(word) {
                if (!TRANSLATE_API_KEY || TRANSLATE_API_KEY.includes("PASTE")) return "ERROR: Translate API Key not configured.";
                const url = `https://translation.googleapis.com/language/translate/v2?key=${TRANSLATE_API_KEY}`;
                
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ q: word, target: 'en', source: 'es' })
                    });
                    if (!response.ok) return "Translation failed.";
                    const result = await response.json();
                    return result.data.translations[0].translatedText;
                } catch (error) { return "Translation unavailable."; }
            },
            async getResponse(history) {
                const systemPrompt = "You are a friendly Spanish tutor. Keep your response in Spanish and brief (1 sentence).";
                const userPrompt = `The last message was: "${history[0].parts[0].text}". Respond to the user.`;
                return this.callGemini(systemPrompt, userPrompt);
            }
        };

        function showView(viewId) {
            document.querySelectorAll('.main-view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId)?.classList.add('active');
        }

        function addMessage(text, role) {
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `w-full flex flex-col ${isUser ? 'items-end' : 'items-start'}`;
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble p-3 rounded-lg w-fit ${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'}`;
            
            if (!isUser) {
                text.split(/(\s+)/).forEach(part => {
                    if (part.trim().length > 0) {
                        const wordSpan = document.createElement('span');
                        wordSpan.className = 'clickable-word';
                        wordSpan.textContent = part;
                        bubble.appendChild(wordSpan);
                    } else {
                        bubble.appendChild(document.createTextNode(part));
                    }
                });
            } else {
                bubble.textContent = text;
            }
            
            wrapper.appendChild(bubble);
            dom.chatContainer.insertBefore(wrapper, dom.chatContainer.firstChild);
        }

        async function handleSendMessage() {
            const userInput = dom.chatInput.value.trim();
            if (!userInput) return;
            addMessage(userInput, 'user');
            dom.chatInput.value = '';
            const response = await AIManager.getResponse([{ role: 'user', parts: [{text: userInput}] }]);
            addMessage(response, 'ai');
        }
        
        dom.chatContainer.addEventListener('click', async (e) => {
            if (e.target.classList.contains('clickable-word')) {
                const word = e.target.textContent.trim().replace(/[.,!?¡¿]/g, '');
                if (!word) return;

                const translation = await AIManager.getTranslation(word);
                const popover = dom.translationPopover;
                popover.textContent = translation;
                
                const rect = e.target.getBoundingClientRect();
                const containerRect = dom.appContainer.getBoundingClientRect();
                
                popover.style.left = `${rect.left - containerRect.left + (rect.width / 2) - (popover.offsetWidth / 2)}px`;
                popover.style.top = `${rect.top - containerRect.top - popover.offsetHeight - 8}px`;
                popover.classList.remove('hidden');
            }
        });

        document.body.addEventListener('click', (e) => {
            if (!e.target.closest('.clickable-word')) {
                dom.translationPopover.classList.add('hidden');
            }
        }, true);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showView('chat-view'); 
            } else {
                showView('auth-container');
            }
        });
        
        dom.loginBtn.addEventListener('click', async () => {
            dom.loginError.textContent = '';
            const email = dom.loginEmailInput.value.trim();
            const password = dom.loginPasswordInput.value.trim();
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) { dom.loginError.textContent = error.message; }
        });

        dom.signupBtn.addEventListener('click', async () => {
            dom.signupError.textContent = '';
            const email = dom.signupEmailInput.value.trim();
            const password = dom.signupPasswordInput.value.trim();
            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) { dom.signupError.textContent = error.message; }
        });

        dom.showSignupBtn.addEventListener('click', () => { dom.loginView.classList.add('hidden'); dom.signupView.classList.remove('hidden'); });
        dom.showLoginBtn.addEventListener('click', () => { dom.signupView.classList.add('hidden'); dom.loginView.classList.remove('hidden'); });

        dom.sendBtn.addEventListener('click', handleSendMessage);
        dom.chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSendMessage(); });
    }

    // Run the main app logic once the DOM is ready.
    main();
  </script>
</body>
</html>
