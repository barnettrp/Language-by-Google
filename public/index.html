<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ConvoQuest</title>

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'ocean-teal': '#2A9D8F',
            'sandy-orange': '#F4A261',
            'sun-yellow': '#E9C46A',
            'seashell-white': '#FEFDF5',
          },
        },
      },
    };
  </script>

  <!-- If you were using a "JS normalizer" or any polyfill, keep its <script> tag here -->
  <!-- <script src="js-normalizer.js" defer></script> -->

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji", sans-serif;
      background: #FEFDF5;
    }
  </style>
</head>

<body class="min-h-screen">
  <!-- App wrapper -->
  <div class="mx-auto max-w-3xl p-4">

    <!-- Login Screen -->
    <section id="loginScreen" class="bg-white rounded-2xl shadow p-6 border border-ocean-teal/10">
      <h1 class="text-2xl font-semibold text-ocean-teal mb-4">Welcome to ConvoQuest</h1>
      <p class="text-gray-600 mb-6">Log in to continue.</p>

      <form id="loginForm" class="grid gap-4">
        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Username</span>
          <input id="username" class="border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-ocean-teal" placeholder="yourname" required />
        </label>

        <label class="grid gap-2">
          <span class="text-sm text-gray-700">Password</span>
          <input id="password" type="password" class="border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-ocean-teal" placeholder="••••••••" required />
        </label>

        <button id="loginBtn" class="bg-ocean-teal text-white rounded-xl px-4 py-2 hover:opacity-90 active:opacity-80 transition">
          Log In
        </button>
      </form>
    </section>

    <!-- Main App Screen -->
    <section id="appScreen" class="hidden bg-white rounded-2xl shadow p-6 border border-ocean-teal/10 mt-6">
      <header class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-semibold text-ocean-teal">ConvoQuest</h2>
        <div class="flex gap-2">
          <button id="hintBtn" class="border rounded-lg px-3 py-1 hover:bg-seashell-white">💡 Hint</button>
          <button id="logoutBtn" class="border rounded-lg px-3 py-1 hover:bg-seashell-white">Log out</button>
        </div>
      </header>

      <div id="messages" class="border rounded-xl p-4 h-64 overflow-y-auto bg-seashell-white/60 mb-4">
        <!-- Messages will render here -->
      </div>

      <form id="chatForm" class="flex gap-2">
        <input id="userInput" class="flex-1 border rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-ocean-teal" placeholder="Type a message…" />
        <button id="sendBtn" class="bg-sandy-orange text-white rounded-xl px-4 py-2 hover:opacity-90 active:opacity-80 transition">
          Send
        </button>
      </form>
    </section>

  </div>

  <!-- If you use Firebase, include your firebase-init.js ABOVE app.js -->
  <!-- <script src="./firebase-init.js" defer></script> -->

  <!-- Your app code -->
  <script type="module" src="./app.js"></script>
</body>
</html>
