<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ConvoQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      overflow: auto; 
      min-height: 100vh;
    }
    .contained-area {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-input, #chat-input, #placement-chat-input { font-size: 16px; }
    @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-content, .hint-popover, #translation-popover { animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble-user { background-color: #3b82f6; color: white; }
    .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
    #chat-container::-webkit-scrollbar, #placement-chat-container::-webkit-scrollbar { display: none; }
    #chat-container, #placement-chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .map-location { cursor: pointer; transition: transform 0.2s; }
    .map-location:hover { transform: scale(1.1); }
    .clickable-word { cursor: pointer; }
    .clickable-word:hover { background-color: rgba(59, 130, 246, 0.2); border-radius: 3px; }
    .main-view { display: none; }
    .main-view.active { display: flex; }

    /* App container sizing fix */
    #app-container {
      width: 100%;
      max-width: 640px;
      height: 85vh; /* Stable height on mobile/tablet */
      max-height: 800px; /* Cap the max height */
    }
    @media (min-width: 768px) {
      #app-container {
        height: 90vh; /* Slightly taller on larger screens */
      }
    }
  </style>
</head>
<body class="flex items-start justify-center p-2 md:p-4">

  <div id="app-container" class="contained-area rounded-xl shadow-2xl flex flex-col overflow-hidden mt-10 relative">
    <!-- AUTH VIEW -->
    <div id="auth-container" class="main-view active flex-col h-full p-6 justify-center">
      <div id="login-view">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">ConvoQuest Portal</h1>
        <div class="space-y-4">
          <input type="email" id="login-email-input" placeholder="Email" class="auth-input w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="login-password-input" placeholder="Password" class="auth-input w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p id="login-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
        <div class="mt-4 space-y-2">
          <button id="login-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Log In</button>
          <button id="show-signup-btn" class="w-full text-center text-blue-600 hover:underline">Don't have an account? Sign Up</button>
        </div>

        <div id="signup-view" class="hidden mt-6">
          <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Create your account</h2>
          <div class="space-y-4">
            <input type="text" id="signup-name-input" placeholder="Full name" class="auth-input w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="email" id="signup-email-input" placeholder="Email" class="auth-input w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="signup-password-input" placeholder="Password" class="auth-input w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <p id="signup-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
          <div class="mt-4 space-y-2">
            <button id="signup-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Create Account</button>
            <button id="show-login-btn" class="w-full text-center text-blue-600 hover:underline">Already have an account? Log In</button>
          </div>
        </div>
      </div>
    </div>

    <!-- PLACEMENT VIEW -->
    <div id="placement-view" class="main-view flex-col h-full">
      <div id="placement-quiz-view" class="flex flex-col h-full p-6 justify-center text-center">
        <h1 class="text-2xl font-bold text-gray-800">Placement Test</h1>
        <p id="placement-progress" class="text-gray-600 mt-2 mb-6">Loading question...</p>
        <div id="quiz-question-container">
          <p id="quiz-question-text" class="text-left font-semibold mb-2"></p>
          <div id="quiz-options" class="space-y-2 text-left"></div>
        </div>
        <button id="submit-quiz-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Next</button>
      </div>
       <div id="placement-chat-view" class="hidden flex-col h-full">
        <header class="p-4 border-b"><h1 class="text-xl font-bold text-gray-800">A Quick Chat</h1></header>
        <div id="placement-chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
        <div class="p-2 border-t bg-white/50">
          <div class="flex items-center space-x-2">
            <input type="text" id="placement-chat-input" placeholder="Type your reply..." class="flex-1 p-2 border rounded-md">
            <button id="placement-send-btn" class="bg-blue-500 text-white px-4 py-2 rounded-md font-semibold hover:bg-blue-600 transition-colors">Send</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="main-app-view" class="main-view flex-col h-full">
      <header class="flex items-center justify-between p-4 border-b">
        <h1 id="welcome-message" class="text-2xl font-bold text-gray-800">Welcome, Friend!</h1>
        <div class="flex items-center space-x-2">
          <button id="settings-btn" title="Settings" class="p-2 text-gray-600 hover:text-blue-500">⚙️</button>
        </div>
      </header>
      <div class="flex-1 grid grid-cols-1 gap-0">
        <!-- QUESTS VIEW -->
        <div id="quests-view" class="p-4">
          <h2 class="text-xl font-semibold mb-3 text-gray-800">Quests</h2>
          <div class="space-y-3"></div>
        </div>

        <!-- CHAT VIEW -->
        <div id="chat-view" class="hidden flex-col h-full">
          <header class="p-4 border-b flex items-center justify-between">
            <h1 id="chat-title" class="text-xl font-bold text-gray-800">Chat</h1>
            <button id="end-session-btn" class="text-red-600 hover:underline">End Session</button>
          </header>
          <div id="chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
          <div class="p-2 border-t bg-white/50">
            <div class="flex items-center space-x-2">
              <button id="hint-btn" title="Get a hint" class="p-2 text-gray-600 hover:text-blue-500">💡</button>
              <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              <button id="send-btn" class="bg-blue-500 text-white px-4 py-2 rounded-md font-semibold hover:bg-blue-600 transition-colors">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- MODALS & POPOVERS -->
    <div id="settings-modal" class="hidden absolute inset-0 modal-bg flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4"><h2 class="text-xl font-semibold">Settings</h2><button id="close-settings-btn" class="font-bold text-2xl">&times;</button></div>
            <div class="space-y-4">
                <div><label for="dialect-select" class="block text-sm text-gray-700 mb-1">Dialect</label><select id="dialect-select" class="mt-1 block w-full p-2 border rounded-md"><option>Mexico</option><option>Spain</option><option>Argentina</option></select></div>
                <div><label for="formality-select" class="block text-sm text-gray-700 mb-1">Formality</label><select id="formality-select" class="mt-1 block w-full p-2 border rounded-md"><option>Casual</option><option>Formal</option></select></div>
                <div><label for="vignette-lang-select" class="block text-sm text-gray-700 mb-1">Vignette language</label><select id="vignette-lang-select" class="mt-1 block w-full p-2 border rounded-md"><option>English</option><option>Spanish</option></select></div>
                <button id="retake-placement-btn" class="w-full text-center text-blue-600 hover:underline pt-2">Retake Placement Test</button>
            </div>
        </div>
    </div>
    <div id="vignette-modal" class="hidden absolute inset-0 modal-bg flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-md text-center">

            <p id="vignette-text" class="text-gray-600 mb-6"></p>
            <button id="start-stage-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold">Start Stage</button>
        </div>
    </div>
    <div id="map-modal" class="hidden absolute inset-0 modal-bg flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-lg">
            <div class="mb-4">
                <h2 id="map-title" class="text-2xl font-bold text-gray-800"></h2>
                <p id="map-objective" class="text-gray-600"></p>
            </div>
            <div id="map-container" class="relative">
                <img id="map-image" alt="Map" class="w-full rounded-lg">
            </div>
        </div>
    </div>
    <div id="translation-popover" class="hidden absolute bg-white rounded-lg shadow-xl p-3 text-sm"></div>
    <div id="stage-complete-modal" class="hidden absolute inset-0 modal-bg flex items-center justify-center p-4">
        <div class="modal-content bg-white rounded-lg shadow-xl p-6 w-full max-w-md text-center">
            <h2 class="text-2xl font-bold mb-2">Stage Complete!</h2>
            <p class="text-gray-600 mb-4"><span id="clue
