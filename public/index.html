<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Language Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        @keyframes pop-in {
            0% { transform: scale(0.95) translateY(10px); opacity: 0; }
            100% { transform: scale(1) translateY(0px); opacity: 1; }
        }
        .chat-bubble {
            max-width: 75%;
            animation: pop-in 0.3s ease-out forwards;
        }
        .chat-bubble-user { background-color: #3b82f6; color: white; }
        .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
        .contained-chat-area {
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .correction-btn { opacity: 0; transition: opacity 0.2s; }
        .group:hover .correction-btn { opacity: 1; }
        .speaker-btn { opacity: 0.5; transition: opacity 0.2s; }
        .group:hover .speaker-btn { opacity: 1; }
        .modal-bg {
             background: rgba(0, 0, 0, 0.5);
             backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-lg h-full md:h-[90vh] md:max-h-[700px] contained-chat-area rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Scenario List View -->
        <div id="scenario-view" class="flex flex-col h-full">
            <header class="p-4 border-b border-gray-200/80 flex justify-between items-center">
                <h1 class="text-xl font-bold text-gray-800">Choose a Scenario</h1>
                <button id="settings-btn" title="Settings" class="text-gray-500 hover:text-gray-800 transition-colors">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
            </header>
            <div class="p-4 space-y-3 overflow-y-auto"></div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="hidden flex-col h-full">
            <header class="p-4 border-b border-gray-200/80 flex justify-between items-center">
                <div>
                    <h1 id="chat-title" class="text-xl font-bold text-gray-800"></h1>
                    <p id="chat-description" class="text-sm text-gray-500"></p>
                </div>
                <button id="end-session-btn" class="bg-red-500 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-red-600 transition-colors">End Session</button>
            </header>
            <div id="chat-container" class="flex-1 p-4 space-y-4 overflow-y-auto"></div>
            <div id="translation-popover" class="hidden absolute bg-black text-white text-xs rounded py-1 px-2 z-10 shadow-lg"></div>
            <footer class="p-4 border-t border-gray-200/80">
                <div class="flex items-center space-x-2">
                    <input type="text" id="chat-input" placeholder="Type or tap the mic..." class="flex-1 p-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="mic-btn" class="text-gray-500 hover:text-blue-500 rounded-full p-3 transition-colors">
                        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v6a3 3 0 11-6 0V4z" /><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM2 10a2 2 0 114 0v1a2 2 0 11-4 0v-1zm14-1a2 2 0 10-4 0v1a2 2 0 104 0v-1z" clip-rule="evenodd" /></svg>
                    </button>
                    <button id="send-btn" class="bg-blue-500 text-white rounded-full p-3 hover:bg-blue-600 transition-colors">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Modals (Report, Settings) -->
        <div id="report-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                 <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Session Report</h2><button id="close-report-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                <div id="report-content" class="space-y-4"></div>
                <div id="report-loading" class="hidden text-center"><p>✨ Analyzing your conversation...</p></div>
            </div>
        </div>

        <div id="settings-modal" class="hidden modal-bg fixed inset-0 flex items-center justify-center p-4 z-20">
             <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
                <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold">Settings</h2><button id="close-settings-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button></div>
                <div class="space-y-4">
                    <div>
                        <label class="font-semibold">Dialect</label>
                        <select id="dialect-select" class="w-full mt-1 p-2 border rounded-md"><option value="Mexico">Mexico</option><option value="Spain">Spain</option></select>
                    </div>
                    <div>
                        <label class="font-semibold">Formality</label>
                        <select id="formality-select" class="w-full mt-1 p-2 border rounded-md"><option value="Casual">Casual</option><option value="Formal">Formal</option></select>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- NO API KEY IS STORED IN THE BROWSER ---

        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM ELEMENTS ---
            const scenarioView = document.getElementById('scenario-view');
            const chatView = document.getElementById('chat-view');
            const chatContainer = document.getElementById('chat-container');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const micBtn = document.getElementById('mic-btn');
            const settingsBtn = document.getElementById('settings-btn');
            
            // Modals
            const reportModal = document.getElementById('report-modal');
            const settingsModal = document.getElementById('settings-modal');
            const closeReportBtn = document.getElementById('close-report-btn');
            const closeSettingsBtn = document.getElementById('close-settings-btn');
            const endSessionBtn = document.getElementById('end-session-btn');
            
            // Popover
            const translationPopover = document.getElementById('translation-popover');
           
            // --- SETTINGS ---
            const dialectSelect = document.getElementById('dialect-select');
            const formalitySelect = document.getElementById('formality-select');

            // --- STATE ---
            let currentScenario = null;
            let messages = [];
            let userSettings = {
                dialect: localStorage.getItem('dialect') || 'Mexico',
                formality: localStorage.getItem('formality') || 'Casual'
            };

            // --- SPEECH RECOGNITION & SYNTHESIS ---
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            let recognition = SpeechRecognition ? new SpeechRecognition() : null;
            if (recognition) {
                recognition.continuous = false;
                recognition.lang = 'es-ES'; // Can be adapted based on dialect
                recognition.interimResults = false;
            }
            
            // --- API MANAGER ---
            const AIManager = {
                async callAPI(payload) {
                    try {
                        const response = await fetch('/api/gemini', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) {
                            console.error("API Error:", response.status, await response.text());
                            return { error: "Sorry, I encountered an error." };
                        }
                        return await response.json();
                    } catch (error) {
                        console.error("Fetch Error:", error);
                        return { error: "Sorry, I couldn't connect to the AI." };
                    }
                },
                async getResponse(history, scenario) {
                    const payload = { type: 'chat', history, scenario: { ...scenario, ...userSettings } };
                    const response = await this.callAPI(payload);
                    return response.text || response.error;
                },
                async getCorrection(text) {
                    const payload = { type: 'correction', text };
                    const response = await this.callAPI(payload);
                    return response.text || response.error;
                },
                async analyzeConversation(transcript) {
                    const payload = { type: 'analysis', transcript };
                    const response = await this.callAPI(payload);
                    return response.data || { error: response.error };
                },
                async getTranslation(word, context) {
                    const payload = { type: 'translation', word, context };
                    const response = await this.callAPI(payload);
                    return response.text || response.error;
                }
            };
            
            // --- UI FUNCTIONS ---
            const renderScenarios = () => {
                const scenarioList = scenarioView.querySelector('.space-y-3');
                scenarioList.innerHTML = scenarios.map(s => `
                    <div class="p-4 border rounded-lg hover:bg-gray-50 cursor-pointer scenario-card" data-index="${scenarios.indexOf(s)}">
                        <h3 class="font-semibold">${s.title}</h3>
                        <p class="text-sm text-gray-600">${s.description}</p>
                    </div>
                `).join('');
            };

            const startChat = (scenario) => {
                currentScenario = scenario;
                if(scenario.formality) { // Override default setting if scenario specifies it
                    formalitySelect.value = scenario.formality;
                    updateSetting('formality', scenario.formality);
                } else {
                    formalitySelect.value = userSettings.formality;
                }

                messages = [];
                document.getElementById('chat-title').textContent = scenario.title;
                document.getElementById('chat-description').textContent = scenario.description;
                addMessage("Hola, empecemos. ¿Listo?", 'ai');
                scenarioView.classList.add('hidden');
                chatView.classList.remove('hidden');
                chatView.classList.add('flex');
            };

            const addMessage = (text, role, id = Date.now()) => {
                messages.push({ role, parts: [{ text }] });
                const isUser = role === 'user';
                const wrapper = document.createElement('div');
                wrapper.className = `flex items-end gap-2 ${isUser ? 'justify-end' : 'justify-start'}`;
                wrapper.dataset.messageId = id;
                wrapper.innerHTML = `
                    ${isUser ? `<button title="Correct me" class="correction-btn text-xs bg-gray-200 rounded-full w-6 h-6 flex items-center justify-center mb-1">✨</button>` : ''}
                    <div class="chat-bubble p-3 rounded-lg w-fit ${isUser ? 'chat-bubble-user' : 'chat-bubble-ai group'}">
                        ${text.split(' ').map(word => `<span class="clickable-word cursor-pointer hover:underline">${word}</span>`).join(' ')}
                    </div>
                    ${!isUser ? `<button title="Read aloud" class="speaker-btn text-gray-400 hover:text-gray-700 transition-colors mb-1"><svg class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20"><path d="M7.4 3A1.4 1.4 0 006 4.4v11.2a1.4 1.4 0 002.31 1.05l6.44-5.64a1.4 1.4 0 000-2.1L8.31 3.35A1.4 1.4 0 007.4 3z" /></svg></button>` : ''}
                `;
                chatContainer.appendChild(wrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };

            const addTypingIndicator = () => {
                const indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.className = 'flex justify-start';
                indicator.innerHTML = `
                    <div class="chat-bubble-ai p-3 rounded-lg w-fit flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.2s;"></span>
                        <span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.4s;"></span>
                    </div>`;
                chatContainer.appendChild(indicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
            
            const removeTypingIndicator = () => document.getElementById('typing-indicator')?.remove();

            const showReport = async () => {
                const reportContent = document.getElementById('report-content');
                const reportLoading = document.getElementById('report-loading');
                reportModal.classList.remove('hidden');
                reportContent.innerHTML = '';
                reportLoading.classList.remove('hidden');

                const transcript = messages.map(m => `${m.role}: ${m.parts[0].text}`).join('\n');
                const report = await AIManager.analyzeConversation(transcript);
                
                if (report && !report.error) {
                    reportContent.innerHTML = `
                        <div><h3 class="font-semibold mb-2">New Vocabulary</h3><ul class="list-disc list-inside text-gray-700">${report.newVocabulary.map(v => `<li>${v}</li>`).join('')}</ul></div>
                        <div><h3 class="font-semibold mb-2">Grammar Feedback</h3><p class="text-gray-700">${report.grammarFeedback}</p></div>
                        <div class="flex justify-between items-center bg-gray-100 p-3 rounded-lg"><h3 class="font-semibold">Proficiency Score</h3><p class="text-2xl font-bold text-blue-600">${report.proficiencyScore} / 100</p></div>`;
                } else {
                    reportContent.innerHTML = `<p class="text-gray-700">Sorry, we couldn't generate a report for this session.</p>`;
                }
                reportLoading.classList.add('hidden');
            };

            const updateSetting = (key, value) => {
                userSettings[key] = value;
                localStorage.setItem(key, value);
            };

            // --- DATA ---
             const scenarios = [
                { title: "Open Conversation", description: "Practice freely on any topic.", systemPrompt: "You are a friendly Spanish tutor." },
                { title: "Ordering Coffee", description: "Learn to order drinks and snacks.", systemPrompt: "You are a barista in a Spanish cafe. The user is a customer.", formality: 'Casual' },
                { title: "At the Airport", description: "Practice checking in and asking for directions.", systemPrompt: "You are an airline agent at an airport. The user is a passenger.", formality: 'Formal' },
                { title: "Making Plans", description: "Discuss schedules and activities.", systemPrompt: "You are a friend making plans for the weekend with the user in Spanish.", formality: 'Casual' }
            ];

            // --- EVENT HANDLERS ---
            const handleSendMessage = async () => {
                const text = chatInput.value.trim();
                if (!text) return;
                
                addMessage(text, 'user');
                chatInput.value = '';
                addTypingIndicator();

                const history = messages.slice(-6); // Conversational memory
                const response = await AIManager.getResponse(history, currentScenario);
                removeTypingIndicator();
                addMessage(response, 'ai');
            };

            const handleCorrection = async (target) => {
                const wrapper = target.closest('[data-message-id]');
                const messageText = wrapper.querySelector('.chat-bubble').textContent;
                const correctionText = await AIManager.getCorrection(messageText);
                const bubble = document.createElement('div');
                bubble.className = 'text-xs p-2 rounded-lg bg-yellow-100 text-yellow-800 mt-1 w-fit ml-auto mr-8';
                bubble.innerHTML = correctionText.replace(/\n/g, '<br>');
                wrapper.insertAdjacentElement('afterend', bubble);
                target.remove();
            };

            const handleTranslation = async (target) => {
                const word = target.textContent.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, '');
                if (!word) return;
                const context = target.closest('.chat-bubble').textContent;
                const translationText = await AIManager.getTranslation(word, context);

                const rect = target.getBoundingClientRect();
                translationPopover.innerHTML = translationText.replace(/\n/g, '<br>');
                translationPopover.classList.remove('hidden');
                const popoverRect = translationPopover.getBoundingClientRect();
                translationPopover.style.left = `${rect.left + (rect.width / 2) - (popoverRect.width / 2)}px`;
                translationPopover.style.top = `${rect.top - popoverRect.height - 5}px`;

                setTimeout(() => translationPopover.classList.add('hidden'), 3000);
            };

            const handleTextToSpeech = (target) => {
                const text = target.closest('.chat-bubble').textContent;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = userSettings.dialect === 'Spain' ? 'es-ES' : 'es-MX';
                window.speechSynthesis.speak(utterance);
            };

            // --- EVENT LISTENERS ---
            scenarioView.addEventListener('click', (e) => e.target.closest('.scenario-card') && startChat(scenarios[e.target.closest('.scenario-card').dataset.index]));
            sendBtn.addEventListener('click', handleSendMessage);
            chatInput.addEventListener('keypress', (e) => e.key === 'Enter' && handleSendMessage());
            endSessionBtn.addEventListener('click', showReport);
            
            chatContainer.addEventListener('click', (e) => {
                if (e.target.closest('.correction-btn')) handleCorrection(e.target.closest('.correction-btn'));
                if (e.target.classList.contains('clickable-word')) handleTranslation(e.target);
                if (e.target.closest('.speaker-btn')) handleTextToSpeech(e.target.closest('.speaker-btn'));
            });

            if (recognition) {
                micBtn.addEventListener('click', () => {
                    micBtn.classList.add('text-red-500');
                    recognition.lang = userSettings.dialect === 'Spain' ? 'es-ES' : 'es-MX';
                    recognition.start();
                });
                recognition.onresult = (event) => {
                    chatInput.value = event.results[0][0].transcript;
                    handleSendMessage();
                };
                recognition.onend = () => micBtn.classList.remove('text-red-500');
            } else {
                micBtn.disabled = true;
                micBtn.title = "Speech recognition not supported in this browser.";
            }

            // Settings
            settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
            closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
            closeReportBtn.addEventListener('click', () => reportModal.classList.add('hidden'));
            dialectSelect.addEventListener('change', (e) => updateSetting('dialect', e.target.value));
            formalitySelect.addEventListener('change', (e) => updateSetting('formality', e.target.value));

            // --- INITIALIZATION ---
            dialectSelect.value = userSettings.dialect;
            formalitySelect.value = userSettings.formality;
            renderScenarios();
        });
    </script>
</body>
</html>
