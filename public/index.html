<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Language Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-image: url('https://placehold.co/1200x800/a3e635/ffffff?text=Vibrant+Spanish+Street');
            background-size: cover;
            background-position: center;
        }
        .chat-bubble {
            max-width: 75%;
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop-in {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .chat-bubble-user {
            background-color: #3b82f6; /* blue-500 */
            color: white;
        }
        .chat-bubble-ai {
            background-color: #e5e7eb; /* gray-200 */
            color: #1f2937; /* gray-800 */
        }
        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }
        .contained-chat-area {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen p-4">

    <div class="w-full max-w-lg h-full md:h-[90vh] md:max-h-[700px] contained-chat-area rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- Scenario List View -->
        <div id="scenario-view" class="flex flex-col h-full">
            <header class="p-4 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h1 class="text-xl font-bold text-gray-800">Choose a Scenario</h1>
                    <button id="settings-btn" class="text-gray-500 hover:text-gray-800">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </button>
                </div>
            </header>
            <div class="p-4 space-y-3 overflow-y-auto">
                <!-- Scenarios will be injected here -->
            </div>
        </div>
        
        <!-- Chat View, Report Modal, Settings Modal etc. go here -->
        <!-- The rest of the HTML is identical to the previous version, but with API calls updated -->

        <script>
            // No API key here!

            // --- API SERVICE ---
            const AIManager = {
                async callAPI(endpoint, payload) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) {
                            console.error("API Error:", response.status, await response.text());
                            return { error: "Sorry, I encountered an error." };
                        }
                        return await response.json();
                    } catch (error) {
                        console.error("Fetch Error:", error);
                        return { error: "Sorry, I couldn't connect to the AI." };
                    }
                },

                async getResponse(chatHistory, scenario) {
                    const response = await this.callAPI('/api/gemini', {
                        type: 'chat',
                        history: chatHistory,
                        scenario
                    });
                    return response.text || response.error;
                },

                // Other functions (getCorrection, analyzeConversation) would be updated similarly
            };
            
            // The rest of the JavaScript logic remains the same
        </script>

    </div>
</body>
</html>
