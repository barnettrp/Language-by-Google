<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ConvoQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .contained-area {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-input, #chat-input { font-size: 16px; }
    @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-content, .hint-popover, #translation-popover { animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble-user { background-color: #3b82f6; color: white; }
    .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
    #chat-container::-webkit-scrollbar, #placement-chat-container::-webkit-scrollbar { display: none; }
    #chat-container, #placement-chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .map-location { cursor: pointer; transition: transform 0.2s; }
    .map-location:hover { transform: scale(1.1); }

    /* Debug ribbon */
    #debug-ribbon {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #b91c1c;
      color: #fff;
      text-align: center;
      padding: 4px;
      font-size: 14px;
      z-index: 99999;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen p-0 md:p-4">
  <!-- Debug ribbon -->
  <div id="debug-ribbon">Loading…</div>

  <div id="app-container" class="w-full h-full md:max-w-lg md:h-[90vh] md:max-h-[700px] contained-area rounded-none md:rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    <div id="auth-container" class="flex flex-col h-full p-6 justify-center">
      <!-- Auth HTML goes here -->
    </div>

    <div id="placement-view" class="hidden flex-col h-full">
      <!-- Placement Test UI goes here -->
    </div>

    <div id="main-app-view" class="hidden flex-col h-full">
      <!-- Main App UI goes here -->
    </div>
  </div>

  <!-- Firebase init (must exist in /public) -->
  <script type="module" src="/firebase-init.js?v=debug1"></script>
  <!-- Main app logic -->
  <script src="/app.js?v=debug1" defer></script>

  <!-- Loader probe -->
  <script>
  (function () {
    const ribbon = document.getElementById('debug-ribbon');
    const set = (t) => { if (ribbon) ribbon.textContent = t; };

    set('Index: scripts enqueued');

    window.addEventListener('error', function (e) {
      set('Window error: ' + (e.message || e.filename || 'unknown'));
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      set('Promise rejection: ' + (e.reason && (e.reason.message || e.reason)) );
    });

    setTimeout(() => {
      if (/Loading/i.test(ribbon.textContent)) {
        set('Timeout: /app.js did not execute. Check path or console.');
      }
    }, 1500);
  })();
  </script>
</body>
</html>
