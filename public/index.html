<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <title>ConvoQuest • Login</title>

  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #e6edf7;
      --muted: #8aa0bf;
      --accent: #4c8bf5;
      --danger: #ff5577;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      height: 100%;
    }

    /* Start signed OUT to avoid flash of the wrong view */
    body { min-height: 100vh; }
    .hidden { display: none !important; }

    .container {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 640px;
      background: var(--card);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      padding: 28px;
      transform: translateY(0);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0,0,0,.45);
    }

    h1 { margin: 0 0 12px; font-size: 24px; }
    p  { margin: 0 0 16px; color: var(--muted); }

    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > * { flex: 1 1 180px; }

    button, .btn {
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }
    button:hover, .btn:hover { background: rgba(255,255,255,.08); transform: translateY(-1px); }
    .btn-primary { background: var(--accent); border-color: transparent; color: white; }
    .btn-danger  { background: var(--danger); border-color: transparent; color: white; }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline: none;
    }

    /* Auth-state driven visibility */
    body.signed-out #auth-view { display: block; }
    body.signed-out #app-view  { display: none;  }
    body.signed-in  #auth-view { display: none;  }
    body.signed-in  #app-view  { display: block; }
  </style>
</head>

<!-- Start in signed-out state; firebase-init.js will flip this -->
<body class="signed-out">
  <main class="container">
    <!-- Signed OUT view -->
    <section id="auth-view" class="card">
      <h1>Welcome back</h1>
      <p>Sign in to continue.</p>

      <div class="row" style="margin-top: 16px;">
        <button id="googleSignIn" class="btn btn-primary" type="button">Continue with Google</button>
      </div>

      <p style="margin-top: 16px;">Or use email:</p>
      <form id="emailForm" style="margin-top: 8px;">
        <div class="row">
          <input id="email" type="email" placeholder="Email" autocomplete="email" required />
          <input id="password" type="password" placeholder="Password" autocomplete="current-password" required />
        </div>
        <div class="row" style="margin-top: 12px;">
          <button id="emailSignIn" class="btn btn-primary" type="submit">Sign in</button>
          <button id="emailRegister" class="btn" type="button">Create account</button>
        </div>
      </form>

      <p id="authError" style="color: var(--danger); margin-top: 12px; display:none;"></p>
    </section>

    <!-- Signed IN view (your app area) -->
    <section id="app-view" class="card">
      <h1>ConvoQuest</h1>
      <p>You’re signed in. This is your app shell — safe to expand.</p>

      <div class="row" style="margin-top: 16px;">
        <button id="signOut" class="btn btn-danger" type="button">Sign out</button>
      </div>
    </section>
  </main>

  <!-- Only load your own modules; no inline Firebase init -->
  <script type="module" src="/firebase-init.js"></script>
  <script defer src="/app.js"></script>
</body>
</html>
