<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ConvoQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: light; }
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      overflow: auto; /* allow scrolling so nothing is cut off */
      min-height: 100vh;
    }
    .contained-area {
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .auth-input, #chat-input { font-size: 16px; }
    @keyframes pop-in { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modal-content, .hint-popover, #translation-popover { animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble { max-width: 75%; animation: pop-in 0.3s ease-out forwards; }
    .chat-bubble-user { background-color: #3b82f6; color: white; }
    .chat-bubble-ai { background-color: #f3f4f6; color: #1f2937; }
    #chat-container::-webkit-scrollbar, #placement-chat-container::-webkit-scrollbar { display: none; }
    #chat-container, #placement-chat-container { -ms-overflow-style: none; scrollbar-width: none; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .mic-active { color: #ef4444; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    .map-location { cursor: pointer; transition: transform 0.2s; }
    .map-location:hover { transform: scale(1.1); }

    /* Debug ribbon */
    #debug-ribbon {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: #b91c1c;
      color: #fff;
      text-align: center;
      padding: 4px;
      font-size: 14px;
      z-index: 99999;
      -webkit-user-select: none; user-select: none;
    }

    /* App container sizing */
    #app-container {
      width: 100%;
      max-width: 640px;
      height: auto;
      max-height: none;
    }
    @media (min-width: 768px) {
      #app-container {
        height: 90vh;
        max-height: 700px;
      }
    }

    /* --- Nuclear CSS flip when signed in --- */
    body.signed-in #auth-container { display: none !important; }
    body.signed-in #main-app-view { display: flex !important; }
    body.signed-in #main-app-view.hidden { display: flex !important; }
    body.signed-in #quest-view { display: flex !important; }
    body.signed-in #chat-view { display: none !important; }
  </style>
</head>
<body class="flex items-start justify-center p-2 md:p-4">
  <!-- Debug ribbon -->
  <div id="debug-ribbon">Loadingâ¦</div>

  <div id="app-container" class="contained-area rounded-xl shadow-2xl flex flex-col overflow-hidden mt-10">
    <!-- AUTH VIEWS -->
    <div id="auth-container" class="flex flex-col h-full p-6 justify-center">
      <!-- LOGIN VIEW -->
      <div id="login-view">
        <div class="flex justify-center mb-4">
          <svg class="h-16 w-16 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <line x1="10" y1="12" x2="14" y2="8"></line><line x1="14" y1="12" x2="10" y2="16"></line><line x1="12" y1="10" x2="12" y2="10"></line>
          </svg>
        </div>
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome to ConvoQuest</h1>
        <div class="space-y-4">
          <input type="email" id="login-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="login-password-input" placeholder="Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p id="login-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
        <div class="mt-4 space-y-2">
          <button id="login-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Log In</button>
          <button id="show-signup-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Don't have an account? Sign Up</button>
        </div>
      </div>

      <!-- SIGNUP VIEW -->
      <div id="signup-view" class="hidden">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h1>
        <div class="space-y-4">
          <input type="text" id="signup-name-input" placeholder="Name" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="email" id="signup-email-input" placeholder="Email" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="signup-password-input" placeholder="Password (min. 6 characters)" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
          <input type="password" id="signup-confirm-password-input" placeholder="Confirm Password" class="auth-input w-full p-3 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <p id="signup-error" class="text-red-500 text-sm mt-2 text-center h-4"></p>
        <div class="mt-4 space-y-2">
          <button id="signup-btn" class="w-full bg-blue-500 text-white p-3 rounded-md font-semibold hover:bg-blue-600 transition-colors">Create Account</button>
          <button id="show-login-btn" class="w-full text-center text-sm text-blue-600 hover:underline">Already have an account? Log In</button>
        </div>
      </div>
    </div>

    <!-- PLACEMENT VIEW (minimal shell) -->
    <div id="placement-view" class="hidden flex-col h-full">
      <div id="placement-quiz-view" class="flex flex-col h-full p-6 justify-center text-center">
        <h1 class="text-2xl font-bold text-gray-800">Placement Test</h1>
        <p class="text-gray-600 mt-2 mb-6">Let's find the right starting point for you.</p>
        <div id="quiz-question-container">
          <p class="text-lg mb-4">Read the sentence and answer the question:</p>
          <p class="bg-gray-100 p-4 rounded-lg text-left mb-4 italic">"MarÃ­a va a la tienda a comprar pan."</p>
          <p class="text-left font-semibold mb-2">Where is MarÃ­a going?</p>
          <div id="quiz-options" class="space-y-2 text-left">
            <label class="block p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="radio" name="quiz" value="a" class="mr-2"> The park</label>
            <label class="block p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="radio" name="quiz" value="b" class="mr-2"> The store</label>
            <label class="block p-3 border rounded-lg hover:bg-gray-50 cursor-pointer"><input type="radio" name="quiz" value="c" class="mr-2"> Her house</label>
          </div>
        </div>
        <button id="submit-quiz-btn" class="w-full bg-blue-500 text-white p-3 mt-6 rounded-md font-semibold hover:bg-blue-600 transition-colors">Next</button>
      </div>
    </div>

    <!-- MAIN APP VIEW -->
    <div id="main-app-view" class="hidden flex-col h-full">
      <div id="quest-view" class="flex flex-col h-full">
        <header class="p-4 border-b border-gray-200/80 flex justify-between items-center flex-shrink-0">
          <h1 id="welcome-message" class="text-xl font-bold text-gray-800">Choose a Quest</h1>
          <div>
            <button id="settings-btn" class="text-gray-500 hover:text-gray-800 transition-colors inline-flex items-center justify-center h-8 w-8">âï¸</button>
            <button id="logout-btn" class="text-gray-500 hover:text-red-500 transition-colors inline-flex items-center justify-center h-8 w-8">â</button>
          </div>
        </header>
        <div class="p-4 space-y-3 overflow-y-auto"></div>
      </div>

      <div id="chat-view" class="hidden flex-col h-full">
        <header class="p-4 border-b border-gray-200/80 flex justify-between items-center flex-shrink-0">
          <h1 id="chat-title" class="text-xl font-bold text-gray-800"></h1>
          <button id="end-session-btn" class="bg-blue-500 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-blue-600 transition-colors">Complete Stage</button>
        </header>
        <div id="chat-container" class="flex flex-col-reverse flex-1 p-4 space-y-4 space-y-reverse overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- Firebase init -->
  <script type="module" src="/firebase-init.js?v=debug-css"></script>
  <!-- Main app -->
  <script src="/app.js?v=debug-css" defer></script>
</body>
</html>
