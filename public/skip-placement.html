<!DOCTYPE html>
<html>
<head>
    <title>Skip Placement Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      #version-display {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 8px;
        border-radius: 4px;
        z-index: 10000;
        font-family: monospace;
        pointer-events: none;
        backdrop-filter: blur(4px);
        user-select: none;
      }
      .container {
        background: white;
        color: #333;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        text-align: center;
      }
    </style>
</head>
<body>
    <div id="version-display">v2.2.7</div>
    <div class="container">
      <h1>Setting placement as completed...</h1>
      <script>
        localStorage.setItem('placementCompleted', 'true');
        alert('Placement test marked as completed! You can close this tab and refresh your app.');
      </script>
    </div>
</body>
</html>
