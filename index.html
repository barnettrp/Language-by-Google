<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Language Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .chat-bubble {
            max-width: 75%;
        }
        .chat-bubble-user {
            background-color: #3b82f6; /* blue-500 */
            color: white;
        }
        .chat-bubble-ai {
            background-color: #e5e7eb; /* gray-200 */
            color: #1f2937; /* gray-800 */
        }
        #chat-container::-webkit-scrollbar {
            display: none;
        }
        #chat-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .correction-btn {
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .group:hover .correction-btn {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="w-full max-w-lg h-full md:h-[90vh] md:max-h-[700px] bg-white rounded-lg shadow-2xl flex flex-col">

        <!-- Scenario List View -->
        <div id="scenario-view" class="flex flex-col h-full">
            <header class="p-4 border-b">
                <h1 class="text-xl font-bold text-gray-800">Choose a Scenario</h1>
            </header>
            <div class="p-4 space-y-3 overflow-y-auto">
                <!-- Scenarios will be injected here -->
            </div>
        </div>

        <!-- Chat View -->
        <div id="chat-view" class="hidden flex-col h-full">
            <header class="p-4 border-b flex justify-between items-center">
                <div>
                    <h1 id="chat-title" class="text-xl font-bold text-gray-800">Conversation</h1>
                    <p id="chat-description" class="text-sm text-gray-500"></p>
                </div>
                <button id="end-session-btn" class="bg-red-500 text-white px-3 py-1 rounded-md text-sm font-semibold hover:bg-red-600 transition-colors">End Session</button>
            </header>
            
            <div id="chat-container" class="flex-1 p-4 space-y-4 overflow-y-auto">
                <!-- Chat messages will be injected here -->
            </div>

            <div id="translation-popover" class="hidden absolute bg-black text-white text-xs rounded py-1 px-2 z-10"></div>

            <footer class="p-4 border-t">
                <div class="flex items-center space-x-2">
                    <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 p-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="send-btn" class="bg-blue-500 text-white rounded-full p-3 hover:bg-blue-600 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
                    </button>
                </div>
            </footer>
        </div>

        <!-- Progress Report Modal -->
        <div id="report-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-20">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md animate-fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Session Report</h2>
                    <button id="close-report-btn" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                </div>
                <div id="report-content" class="space-y-4">
                    <div>
                        <h3 class="font-semibold mb-2">New Vocabulary</h3>
                        <ul id="report-vocab" class="list-disc list-inside text-gray-700"></ul>
                    </div>
                    <div>
                        <h3 class="font-semibold mb-2">Grammar Feedback</h3>
                        <p id="report-grammar" class="text-gray-700"></p>
                    </div>
                    <div class="flex justify-between items-center bg-gray-100 p-3 rounded-lg">
                        <h3 class="font-semibold">Proficiency Score</h3>
                        <p id="report-score" class="text-2xl font-bold text-blue-600"></p>
                    </div>
                </div>
                 <div id="report-loading" class="hidden text-center">
                    <p>✨ Analyzing your conversation...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- IMPORTANT: PASTE YOUR GEMINI API KEY HERE ---
            const GEMINI_API_KEY = ""; 

            // --- DOM ELEMENTS ---
            const scenarioView = document.getElementById('scenario-view');
            const chatView = document.getElementById('chat-view');
            const reportModal = document.getElementById('report-modal');
            const chatContainer = document.getElementById('chat-container');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const endSessionBtn = document.getElementById('end-session-btn');
            const closeReportBtn = document.getElementById('close-report-btn');
            const translationPopover = document.getElementById('translation-popover');
            const reportContent = document.getElementById('report-content');
            const reportLoading = document.getElementById('report-loading');

            // --- GEMINI API SERVICE ---
            const GeminiAIManager = {
                async callGemini(systemPrompt, userPrompt = "") {
                    if (!GEMINI_API_KEY) {
                        alert("Please add your Gemini API key at the top of the <script> tag.");
                        return "API Key missing.";
                    }
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${GEMINI_API_KEY}`;
                    
                    const payload = {
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        contents: [{ parts: [{ text: userPrompt }] }]
                    };

                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) {
                            console.error("API Error:", response.status, await response.text());
                            return "Sorry, I encountered an error.";
                        }
                        const result = await response.json();
                        return result.candidates[0].content.parts[0].text;
                    } catch (error) {
                        console.error("Fetch Error:", error);
                        return "Sorry, I couldn't connect to the AI.";
                    }
                },

                async getResponse(input, scenarioPrompt) {
                    return this.callGemini(scenarioPrompt, input);
                },

                async getCorrection(text) {
                    const systemPrompt = "You are a helpful language assistant. The user has provided a sentence in Spanish. Correct any grammatical errors and provide a brief, one-sentence explanation of the correction in English. Respond in the format: 'Corrected: [Corrected Spanish sentence]\nExplanation: [English explanation]'";
                    return this.callGemini(systemPrompt, text);
                },

                async analyzeConversation(transcript) {
                    const systemPrompt = `Analyze the following Spanish conversation transcript. The user is the language learner. Provide the following in a JSON format with keys "newVocabulary", "grammarFeedback", and "proficiencyScore":
                    1. newVocabulary: An array of 3-5 key Spanish words or phrases the user learned or should learn.
                    2. grammarFeedback: A brief, encouraging paragraph (2-3 sentences) with one key grammar suggestion.
                    3. proficiencyScore: An estimated proficiency score from 0 to 100.`;
                     const responseText = await this.callGemini(systemPrompt, transcript);
                    try {
                        return JSON.parse(responseText);
                    } catch (e) {
                        console.error("Failed to parse analysis JSON:", e);
                        return null;
                    }
                }
            };

            // --- DATA ---
            const scenarios = [
                { title: "Open Conversation", description: "Practice freely on any topic.", systemPrompt: "You are a friendly Spanish tutor. Keep your responses concise (1-2 sentences) and engaging." },
                { title: "Ordering Coffee", description: "Learn to order drinks and snacks.", systemPrompt: "You are a barista in a Spanish cafe. The user is a customer. Keep your responses concise." },
                { title: "At the Airport", description: "Practice checking in and asking for directions.", systemPrompt: "You are an airline agent at an airport in Madrid. The user is a passenger. Keep your responses concise." },
                { title: "Making Plans", description: "Discuss schedules and activities.", systemPrompt: "You are a friend making plans for the weekend with the user in Spanish. Be friendly and casual, keeping responses concise." }
            ];
            
            let currentScenario = null;
            let messages = [];

            // --- FUNCTIONS ---
            const renderScenarios = () => {
                const scenarioList = scenarioView.querySelector('.space-y-3');
                scenarioList.innerHTML = scenarios.map(s => `
                    <div class="p-4 border rounded-lg hover:bg-gray-50 cursor-pointer scenario-card" data-prompt="${s.systemPrompt}" data-title="${s.title}" data-description="${s.description}">
                        <h3 class="font-semibold">${s.title}</h3>
                        <p class="text-sm text-gray-600">${s.description}</p>
                    </div>
                `).join('');
            };

            const startChat = (scenario) => {
                currentScenario = scenario;
                messages = [];
                document.getElementById('chat-title').textContent = scenario.title;
                document.getElementById('chat-description').textContent = scenario.description;
                
                addMessage("Hola, empecemos. ¿Listo?", false);

                scenarioView.classList.add('hidden');
                chatView.classList.remove('hidden');
                chatView.classList.add('flex');
            };

            const addMessage = (text, isUser, id = Date.now()) => {
                messages.push({ text, isUser });
                const bubble = document.createElement('div');
                bubble.classList.add('chat-bubble', 'p-3', 'rounded-lg', 'w-fit');
                bubble.classList.add(isUser ? 'chat-bubble-user' : 'chat-bubble-ai');
                
                const wrapper = document.createElement('div');
                wrapper.classList.add('flex', 'items-center', 'gap-2', isUser ? 'justify-end' : 'justify-start');
                wrapper.dataset.messageId = id;

                if (isUser) {
                    wrapper.classList.add('group');
                    const correctionBtn = document.createElement('button');
                    correctionBtn.innerHTML = '✨';
                    correctionBtn.title = "Correct me";
                    correctionBtn.classList.add('correction-btn', 'text-xs', 'bg-gray-200', 'rounded-full', 'w-6', 'h-6', 'flex', 'items-center', 'justify-center');
                    correctionBtn.onclick = () => getCorrection(text, id);
                    wrapper.appendChild(correctionBtn);
                }
                
                bubble.innerHTML = text.split(' ').map(word => `<span class="clickable-word cursor-pointer hover:underline">${word}</span>`).join(' ');
                
                wrapper.appendChild(bubble);
                chatContainer.appendChild(wrapper);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            };
            
            const addTypingIndicator = () => {
                const indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.classList.add('chat-bubble', 'chat-bubble-ai', 'p-3', 'rounded-lg', 'w-fit', 'flex', 'items-center', 'gap-1');
                indicator.innerHTML = `<span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></span><span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse [animation-delay:0.2s]"></span><span class="w-2 h-2 bg-gray-400 rounded-full animate-pulse [animation-delay:0.4s]"></span>`;
                chatContainer.appendChild(indicator);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
            
            const removeTypingIndicator = () => {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
            }

            const getCorrection = async (text, messageId) => {
                const correctionText = await GeminiAIManager.getCorrection(text);
                const correctionBubble = document.createElement('div');
                correctionBubble.classList.add('text-xs', 'p-2', 'rounded-lg', 'bg-yellow-100', 'text-yellow-800', 'mt-1', 'w-fit', 'ml-auto');
                correctionBubble.innerHTML = correctionText.replace(/\n/g, '<br>');
                
                const messageWrapper = document.querySelector(`[data-message-id='${messageId}']`);
                if (messageWrapper) {
                   const container = messageWrapper.parentElement;
                   container.insertBefore(correctionBubble, messageWrapper.nextSibling);
                }
            };

            const handleSendMessage = async () => {
                const text = chatInput.value.trim();
                if (text) {
                    addMessage(text, true);
                    chatInput.value = '';
                    addTypingIndicator();
                    
                    const response = await GeminiAIManager.getResponse(text, currentScenario.systemPrompt);
                    removeTypingIndicator();
                    addMessage(response, false);
                }
            };

            const showReport = async () => {
                reportModal.classList.remove('hidden');
                reportContent.classList.add('hidden');
                reportLoading.classList.remove('hidden');

                const transcript = messages.map(m => `${m.isUser ? 'User' : 'Tutor'}: ${m.text}`).join('\n');
                const report = await GeminiAIManager.analyzeConversation(transcript);
                
                if (report) {
                    reportContent.innerHTML = `
                        <div>
                            <h3 class="font-semibold mb-2">New Vocabulary</h3>
                            <ul id="report-vocab" class="list-disc list-inside text-gray-700">
                                ${report.newVocabulary.map(v => `<li>${v}</li>`).join('')}
                            </ul>
                        </div>
                        <div>
                            <h3 class="font-semibold mb-2">Grammar Feedback</h3>
                            <p id="report-grammar" class="text-gray-700">${report.grammarFeedback}</p>
                        </div>
                        <div class="flex justify-between items-center bg-gray-100 p-3 rounded-lg">
                            <h3 class="font-semibold">Proficiency Score</h3>
                            <p id="report-score" class="text-2xl font-bold text-blue-600">${report.proficiencyScore} / 100</p>
                        </div>
                    `;
                } else {
                     reportContent.innerHTML = `<p class="text-gray-700">Sorry, we couldn't generate a report for this session.</p>`;
                }
                
                reportLoading.classList.add('hidden');
                reportContent.classList.remove('hidden');
            };

            // --- EVENT LISTENERS ---
            scenarioView.addEventListener('click', (e) => {
                const card = e.target.closest('.scenario-card');
                if (card) {
                    startChat({
                        title: card.dataset.title,
                        description: card.dataset.description,
                        systemPrompt: card.dataset.prompt
                    });
                }
            });

            sendBtn.addEventListener('click', handleSendMessage);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSendMessage();
            });

            endSessionBtn.addEventListener('click', showReport);
            closeReportBtn.addEventListener('click', () => reportModal.classList.add('hidden'));

            chatContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('clickable-word')) {
                    const word = e.target.textContent.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, '');
                    // This could be replaced with a live translation API call
                    const translation = `${word} (translation)`;
                    
                    const rect = e.target.getBoundingClientRect();
                    translationPopover.textContent = translation;
                    translationPopover.style.left = `${rect.left + (rect.width / 2) - (translationPopover.offsetWidth / 2)}px`;
                    translationPopover.style.top = `${rect.top - translationPopover.offsetHeight - 5}px`;
                    translationPopover.classList.remove('hidden');

                    setTimeout(() => translationPopover.classList.add('hidden'), 2000);
                }
            });

            // --- INITIALIZATION ---
            renderScenarios();
        });
    </script>
</body>
</html>
